<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F3EC">
<meta name="description" content="L'app de formation de l'équipe Limitless chez Partner.Co : réseaux sociaux, business, produits et mindset.">
<meta property="og:type" content="website">
<meta property="og:title" content="Académie Limitless">
<meta property="og:description" content="Tout ce dont tu as besoin pour faire de ta décision un succès : réseaux sociaux, business, produits et mindset.">
<meta property="og:url" content="https://academie.dufourmedia.ca/">
<meta property="og:image" content="https://academie.dufourmedia.ca/img/apercu.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="fr_CA">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Académie Limitless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Poppins:wght@600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Palette douce : crème rosé, vieux rose, brun-prune, sauge — assortie aux photos. Layout : appli de formation — rail de modules à gauche (desktop) / bande défilante (mobile), contenu en colonne lisible, pastilles "autocollant" pour l'état */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --ink:#1C1A17; --muted:#6E665D; --line:#E6DFD3;
  --accent:#1C1A17; --accent-ink:#F7F3EC; --accent-soft:#EFE8DC; --accent-text:#86663B; --lilac:#EFE8DC;
  --sun:#E8DAC2; --sun-ink:#3E2F1C;
  --ok:#86663B; --ok-soft:#EFE6D8; --warn:#A8521A; --warn-soft:#F8EADC; --no:#B3302F; --no-soft:#F7E2DF;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131210; --surface:#1D1B18; --ink:#F3EEE6; --muted:#A99F93; --line:#302C27;
  --accent:#C9A46A; --accent-ink:#16130F; --accent-soft:#2A251E; --accent-text:#D6B47F; --lilac:#2A251E;
  --sun:#3A3023; --sun-ink:#EEDFC6;
  --ok:#D6B47F; --ok-soft:#2E2619; --warn:#EBA066; --warn-soft:#352416; --no:#F08A80; --no-soft:#3A1C19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131210; --surface:#1D1B18; --ink:#F3EEE6; --muted:#A99F93; --line:#302C27;
  --accent:#C9A46A; --accent-ink:#16130F; --accent-soft:#2A251E; --accent-text:#D6B47F; --lilac:#2A251E;
  --sun:#3A3023; --sun-ink:#EEDFC6;
  --ok:#D6B47F; --ok-soft:#2E2619; --warn:#EBA066; --warn-soft:#352416; --no:#F08A80; --no-soft:#3A1C19;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
p{margin:0}
a{color:var(--accent-text)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;min-width:0}.brand-logo{display:block;width:148px;max-height:72px;height:auto;object-fit:contain}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.brand span em{font-style:normal}
.brand b{white-space:nowrap}
@media (max-width:520px){.brand span em{display:none}.menu-btn{padding:7px 10px}}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:180px;flex:0 1 280px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent-text);border-radius:99px;transition:width .4s}
.prog small{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}

/* Structure */
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:4px}
.rail .grp{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.rail-s{padding:0 0 8px}
.rail-s input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.rail-s input:focus{outline:2px solid var(--accent-text);outline-offset:1px}
.grp-btn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--ink);padding:10px;border-radius:10px;font-family:var(--f-display);font-weight:700;font-size:16px;text-align:left}
.grp-btn:hover{background:var(--accent-soft)}
.grp-btn .chev{display:inline-block;width:14px;font-size:18px;line-height:1;color:var(--accent-text);transition:transform .2s}
.grp-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.grp-btn .d{white-space:nowrap;flex:0 0 auto;margin-left:auto;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}
.grp-items{display:flex;flex-direction:column;gap:2px;padding-left:14px}
.rail a .t{min-width:0}
.rail a.sub-h{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);padding:10px 10px 2px}
.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.rail a:hover{background:var(--accent-soft)}
.rail a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.rail a .n{font-family:var(--f-mono);font-size:12px;opacity:.7;width:20px}
.rail a .d{white-space:nowrap;flex:0 0 auto;margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
main{min-width:0}

.menu-btn{display:none;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px}
.menu-btn .ham{display:flex;flex-direction:column;gap:4px;width:18px}
.menu-btn .ham i{display:block;height:2px;border-radius:2px;background:currentColor;transition:transform .2s,opacity .2s}
.menu-open .menu-btn .ham i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.menu-open .menu-btn .ham i:nth-child(2){opacity:0}
.menu-open .menu-btn .ham i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:16px}
  .menu-btn{display:inline-flex;margin-left:auto}
  .prog{order:3;flex:1 1 100%;margin-left:0}
  nav.rail{display:none;position:fixed;top:var(--hh,64px);left:0;right:0;bottom:0;z-index:4;background:var(--surface);overflow-y:auto;overscroll-behavior:contain;padding-block:12px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .menu-open nav.rail{display:flex}
  .menu-open{overflow:hidden}
  .rail a{padding:12px 10px;font-size:16px}
}

/* Page module */
.kicker{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-text);margin-bottom:8px}
.mod-h{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.mod-h h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.025em}
.lead{font-size:18px;color:var(--muted);max-width:62ch}
section.blk{margin-top:32px;display:flex;flex-direction:column;gap:12px}
section.blk>h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.prose{max-width:66ch;display:flex;flex-direction:column;gap:12px}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:18px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.sticker{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;width:fit-content}
.st-sun{background:var(--sun);color:var(--sun-ink);transform:rotate(-2deg)}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-no{background:var(--no-soft);color:var(--no)}
.st-warn{background:var(--warn-soft);color:var(--warn)}

.ratio{display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:700;font-size:14px}
.ratio div{display:flex;align-items:center;padding:0 12px;min-width:0;white-space:nowrap;overflow:hidden}
.r70{flex:70;background:var(--accent);color:var(--accent-ink)}
.r20{flex:20;background:var(--sun);color:var(--sun-ink)}
.r10{flex:10;background:var(--ink);color:var(--bg)}

/* Séquence de stories : écrans téléphone */
.stories{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.phone{flex:0 0 168px;aspect-ratio:9/16;max-width:100%;border-radius:20px;background:var(--ink);color:var(--bg);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.phone .tk{display:flex;gap:3px}
.phone .tk i{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb,var(--bg) 35%,transparent)}
.phone .tk i.on{background:var(--bg)}
.phone b{font-family:var(--f-display);font-size:17px;line-height:1.15}
.phone p{font-size:13px;opacity:.85;line-height:1.35}
.phone .stk{margin-top:auto;background:var(--surface);color:var(--ink);border-radius:10px;padding:8px;font-size:12px;font-weight:600;text-align:center}

/* Choses à dire / à éviter */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.vs{grid-template-columns:1fr}}
.vs .card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 12px;align-items:center}
.swap .x{color:var(--no);text-decoration:line-through;text-decoration-thickness:1px}
.swap .arrow{font-family:var(--f-mono);color:var(--muted)}
.swap .y{color:var(--ok);font-weight:600}
@media (max-width:520px){.swap{grid-template-columns:minmax(0,1fr)}.swap .arrow{display:none}.swap .y{margin-bottom:8px}}

/* Script / DM */
.script{background:var(--lilac);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative}
.script .who{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text)}
.script p{white-space:pre-line}
.script details{display:flex;flex-direction:column}
.script summary{cursor:pointer;font-weight:600;color:var(--accent-text);list-style:none;padding:4px 0}
.script summary::-webkit-details-marker{display:none}
.script details[open] summary{margin-bottom:6px}
.script details[open] summary{font-size:0}
.script details[open] summary::after{content:"− Réduire";font-size:15px}
.sc-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sc-btn{border:0;background:none;color:var(--accent-text);font-weight:600;font-size:13px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.sc-mod{text-transform:none;letter-spacing:0;color:var(--muted)}
.sc-ed{width:100%;font:inherit;line-height:1.5;color:var(--ink);background:var(--surface);border:1.5px solid var(--accent-text);border-radius:10px;padding:10px 12px;resize:vertical}
.copy{align-self:flex-start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.copy:hover{border-color:var(--accent)}

/* Sélecteur d'intérêts */
.bq{display:flex;flex-direction:column;gap:8px}
.brand-out{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.brand-prev{display:grid;grid-template-columns:1fr 180px;gap:16px;align-items:center}
@media (max-width:620px){.brand-prev{grid-template-columns:1fr}}
.sw{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sw div{display:flex;flex-direction:column;gap:4px;font-size:12px}
.sw i{display:block;height:64px;border-radius:12px;border:1px solid var(--line)}
.sw b{font-family:var(--f-mono);font-weight:500;font-size:11px}
.sw span{color:var(--muted)}
.mock{aspect-ratio:9/16;border-radius:16px;border:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center;max-width:180px;width:100%;justify-self:center}
.mock-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.mock-t{font-size:22px;line-height:1.1;font-weight:700}
.mock-p{font-size:11px;opacity:.85}
.mock-b{margin:8px auto 0;border-radius:99px;padding:6px 12px;font-size:11px;font-weight:700}
.ph-tg{display:inline-flex;align-self:flex-start;background:var(--accent-soft);border-radius:99px;padding:4px;gap:4px}
.ph-b{border:0;background:none;color:var(--ink);font-weight:600;font-size:14px;padding:7px 14px;border-radius:99px}
.ph-b[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.pts{grid-template-columns:minmax(0,1fr)}}
.pt-c{gap:10px}
.pt-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pt-h h3{font-size:17px;flex:1;min-width:0}
.pt-tip{font-size:14px;color:var(--muted)}
.acct{gap:10px;margin-bottom:6px}
.acct-on{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
section.acct-top{margin-top:20px}
.acct-f{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px}
@media (max-width:720px){.acct-f{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}

/* Reels */
.reel{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.reel .beats{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.reel .tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.onscreen{font-family:var(--f-display);font-weight:700;background:var(--sun);color:var(--sun-ink);padding:2px 8px;border-radius:6px;display:inline}

/* Leçons à cocher */
.lessons{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.lesson{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.lesson input{width:22px;height:22px;accent-color:var(--accent-text);flex:0 0 auto;margin:1px 0 0}
.lesson.done .lt{color:var(--muted);text-decoration:line-through}
.lesson .lt{flex:1;min-width:0}
.lesson .lk{flex:0 0 auto;font-weight:600;white-space:nowrap;align-self:center}
@media (max-width:520px){.lesson{flex-wrap:wrap}.lesson .lk{margin-left:34px}}
.done-box{border:2px dashed var(--accent);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.done-box h2{font-size:20px}

/* À compléter */
.todo{border:2px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:15px}
.todo b{color:var(--warn)}
.ref{border-left:3px solid var(--line);padding-left:12px;color:var(--muted);font-size:14px}

table{border-collapse:collapse;width:100%;font-size:15px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.day.done{border-color:var(--ok);background:var(--ok-soft)}
.day .dn{display:flex;justify-content:space-between;align-items:center}
.day .dn b{font-family:var(--f-display);font-size:20px}
.day input{width:20px;height:20px;accent-color:var(--ok)}

.home-hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:12px}
.home-team-photo{display:block;width:100%;aspect-ratio:4/1;object-fit:cover;object-position:center 68%;border-radius:14px}
@media(max-width:620px){.home-team-photo{aspect-ratio:2/1;object-position:center 66%}}
.home-hero h1{font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:-.03em}
.home-hero p{font-size:18px;max-width:58ch;opacity:.92}
.rule3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.rule3{grid-template-columns:1fr}}
.rule3 .card b{font-family:var(--f-display);font-size:22px}
.modlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.modlist a{text-decoration:none;color:var(--ink)}
.modlist .card{height:100%}
.modlist .card:hover{border-color:var(--accent)}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px}
.acc summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}
.acc summary::-webkit-details-marker{display:none}
.acc-t{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2}
.acc-i{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px;font-weight:700;line-height:1;transition:transform .2s}
.acc-i .ic-ok{display:none}
.acc.seen .acc-i .ic-plus,.acc[open] .acc-i .ic-plus{display:none}
.acc.seen .acc-i .ic-ok,.acc[open] .acc-i .ic-ok{display:inline}
.acc.seen .acc-i,.acc[open] .acc-i{background:var(--accent-text);color:var(--surface);font-size:18px}
.acc.sub{margin-top:8px;background:var(--bg);border-radius:12px}
.acc.sub summary{padding:12px 14px}
.acc.sub .acc-t{font-size:16px}
.acc.sub .acc-i{width:26px;height:26px;font-size:18px}
.acc.sub .acc-b{padding:0 14px 14px}
.grp-lead{color:var(--muted);margin:-4px 0 4px;font-size:15px}
.acc-b{display:flex;flex-direction:column;gap:12px;padding:0 18px 18px}

let railQ="";
const norm=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function applyRailFilter(){
  const r=document.getElementById("rail");if(!r||!r.querySelectorAll)return;const q=norm(railQ.trim());
  r.querySelectorAll(".grp-items > a:not(.sub-h)").forEach(a=>{const id=(a.getAttribute("href")||"").slice(1);const m=MODULES.find(x=>x.id===id);const txt=norm((m?m.title+" "+(MDESC[id]||"")+" "+(m.sub||""):a.textContent));a.hidden=!!q&&!txt.includes(q);});
  r.querySelectorAll(".grp").forEach(g=>{const items=g.querySelector(".grp-items");const any=[...items.querySelectorAll("a:not(.sub-h)")].some(a=>!a.hidden);
    if(q){items.hidden=!any;g.hidden=!any;}else{g.hidden=false;items.hidden=!openGroups.has(g.querySelector(".grp-btn").dataset.grp);}
    items.querySelectorAll(".sub-h").forEach(sh=>sh.hidden=!!q);});

  if(q&&![...r.querySelectorAll(".grp")].some(g=>!g.hidden)){r.insertAdjacentHTML("beforeend",`<p id="rail-none" class="ref">Aucun module trouvé.</p>`);}
}

  ${startHere()}
  <section class="blk"><div class="cats">${cards}</div></section>
  <section class="blk"><h2>Ta progression</h2><p class="prose">${ACCT.email?"Tu peux aussi":"Sans compte, ta progression est gardée seulement dans ce navigateur. Tu changes d'appareil? Tu peux"} créer un lien de transfert, te l'envoyer (par courriel ou Messenger), puis l'ouvrir sur l'autre appareil : tes cases cochées et tes réponses du cahier suivent.</p>

},
etat(m){
  return head(m,"Ce qui rend un post de vente directe gênant, c'est rarement le produit. C'est le ton. Aujourd'hui, tout le monde repère une pub en une demi-seconde.")+
  `<section class="blk"><h2>Le principe</h2><div class="prose"><p>Tu n'as pas à cacher que tu vends. Tu as juste à ne pas parler comme une pub. Assumer ton projet, c'est beaucoup moins cringe que de faire semblant que ce n'en est pas un.</p><p>On publie d'abord pour être une personne qu'on a envie de suivre. Les ventes viennent des conversations, pas des posts.</p></div>
  <div class="rule3">

   <div class="card"><span class="meta">La story</span><b>Pour vendre</b><p>Le produit dans ta vraie journée, puis un sondage qui ouvre une conversation.</p></div>
   <div class="card"><span class="meta">Le DM</span><b>Pour conclure</b><p>Une vraie conversation, une seule relance, jamais de pression.</p></div>

  <section class="blk"><h2>Mots cringe → ce qu'on dit à la place</h2><div class="card swap">

  </div></section>
  <section class="blk"><h2>Ce qui crée du lien</h2><div class="grid">
   <div class="card"><h3>Le brut</h3><p>Une photo pas parfaite et un texte court peuvent sembler plus humains qu’un visuel trop léché.</p></div>
   <div class="card"><h3>L’autodérision</h3><p>Rire de toi te rend humaine. Les gens aiment partager ce qui les fait rire.</p></div>
   <div class="card"><h3>La transparence</h3><p>Parler aussi de ce qui ne marche pas donne de la crédibilité à ce qui marche.</p></div>
   <div class="card"><h3>Ta niche</h3><p>Parle de ce qui te passionne déjà. Les produits et les découvertes s’intègrent naturellement à cet univers.</p></div>
   <div class="card"><h3>Parle de tes peurs</h3><p>Tu as peur d'être jugée parce que tu t'exposes sur les réseaux sociaux? Parle-en simplement. Tes doutes peuvent ouvrir une vraie conversation.</p></div>
   <div class="card"><h3>L'échec fait partie du parcours</h3><p>Tu as peur d'échouer? Raconte aussi tes essais, tes ratés et ce que tu apprends en chemin. La réussite se construit en avançant.</p></div>
   <div class="card"><h3>Ton vécu avant la leçon</h3><p>Évite les posts trop éducatifs ou génériques : les gens peuvent déjà demander ces infos à ChatGPT. Ce qui te distingue, c'est ton histoire, ton point de vue et ton expérience.</p></div>
   <div class="card"><h3>Montre les coulisses</h3><p>Partage pourquoi tu avances, même quand tu doutes. On s'intéresse d'abord à la personne et à son parcours.</p></div>
  </div></section>
  <section class="blk"><h2>Choisis tes intérêts</h2><p class="prose">L'appli adapte tes idées de posts et tes scripts de reels à ce qui te parle.</p>${picker()}</section>`+lessons(m)+nav(m);
},
mur(m){

  `<section class="blk"><h2>Le ratio 70 / 20 / 10</h2><div class="ratio"><div class="r70">70 % vie et valeur</div><div class="r20">20 % produit</div><div class="r10">10 %</div></div>

  <section class="blk"><h2>Les réflexes portée</h2><div class="grid">

},
stories(m){

  `<section class="blk"><h2>La séquence en 6 écrans</h2><div class="stories">${S.map((s,i)=>`<div class="phone"><div class="tk">${S.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div><span class="meta" style="color:inherit;opacity:.6">${i+1} / 6</span><b>${esc(s[0])}</b><p>${esc(s[1])}</p>${s[2]?`<div class="stk">${esc(s[2])}</div>`:""}</div>`).join("")}</div>

},
reels(m){

  <section class="blk"><h2>Partager partout</h2><div class="prose"><p>Un reel publié sur Instagram peut être partagé sur Facebook en même temps (option dans l'écran de publication). Tu peux aussi le republier en story pour qu'il soit vu par tes abonnées actuelles.</p></div></section>`+lessons(m)+nav(m);
},

  `<section class="blk"><h2>Ton modèle et ton prompt</h2><div class="vs">

`+`  <section class="blk"><h2>Ton skill Limitless, prêt à installer (recommandé)</h2><div class="prose"><p>Un skill, c'est un « mode d'emploi » que tu ajoutes à ton Claude. Celui-ci est fait pour l'équipe : Claude connaît déjà le ton qui attire sans être cringe, la séquence de stories en 6 écrans, les carrousels, les messages privés, les règles de conformité et tous les produits. Tu lui demandes « fais-moi une séquence de stories sur le Noni », et il sait quoi faire.</p></div>

   <div class="prose"><ol>

  <section class="blk"><h2>Pas de skill? Ton projet « Mon contenu »</h2><div class="prose"><p>Tu ne veux pas installer le skill, ou tu restes au forfait gratuit pour l'instant? Fais plutôt cette étape. Elle prend environ 15 minutes, une seule fois.</p><ol>

`)+lessons(m)+nav(m);

chrome(m){
  return head(m,"Avec l'extension Claude dans Chrome, Claude ouvre ton profil et tes statistiques dans ton navigateur et fait l'analyse pour toi. Toi, tu prends les décisions.")+
  acc(`<section class="blk"><h2>C'est quoi</h2><div class="prose"><p>Claude dans Chrome est une extension qui s'ouvre dans un panneau à côté de ta page. Elle peut lire la page, cliquer, défiler et naviguer dans ton Chrome, avec tes comptes déjà connectés. Tu lui dis quoi faire en mots, comme à une assistante.</p><p>Elle fonctionne avec un abonnement Claude payant, dans Google Chrome sur ordinateur seulement (pas sur le téléphone ni dans les autres navigateurs).</p></div></section>
  <section class="blk"><h2>L'installation (5 minutes)</h2><div class="prose"><ol>
   <li>Dans Chrome, installe l'extension Claude depuis le Chrome Web Store.</li>
   <li>Connecte-toi avec ton compte Claude et épingle l'extension dans ta barre d'outils.</li>
   <li>Accepte les permissions demandées.</li>
   <li>Connecte-toi à Instagram et à Facebook dans le même Chrome.</li>
   <li>Ouvre le panneau avec l'icône Claude dans la barre d'outils.</li>
  </ol></div>
  <div class="card"><span class="sticker st-sun">Conseil</span><p>Pour tes réseaux sociaux, choisis le mode <b>« Approuver manuellement »</b> au début : Claude te montre chaque action avant de la faire. Quand tu es à l'aise, tu pourras passer en approbation automatique.</p></div></section>
  <section class="blk"><h2>Tu débutes? 2 prompts, dans l'ordre</h2><div class="prose"><ol>
   <li><b>/depart</b> : Claude passe ton profil au complet (photo, nom, bio, lien, stories à la une, publications épinglées, grille, Facebook) et te donne 5 actions à faire en 30 minutes.</li>
   <li><b>/plan</b> : dans la même conversation, juste après l'audit, Claude te dit vers quoi orienter ton contenu pour attirer plus de monde, et quoi publier sur ton feed et en story pour vendre et recruter.</li>
  </ol><p>Fais-les dans la même conversation : le deuxième part des résultats du premier. Chacun te remet un PDF à télécharger et à garder. S'ils te donnent un bon résultat, sauvegarde-les comme raccourcis (tu tapes ensuite « / » et leur nom).</p><p class="ref">Si le panneau ne te propose pas de télécharger le PDF, copie le résultat dans une conversation sur claude.ai et demande : « Mets ça en PDF téléchargeable. »</p></div>
  <div class="card"><span class="sticker st-sun">Pas d'abonnement?</span><p>Tu ne veux pas payer pour Claude Pro? Demande à ton upline (la personne qui t'a inscrite chez Partner.Co) de faire ton audit /depart et ton /plan avec toi.</p></div>
  <div class="grid">${CHROME_START.map(p=>script(p.who,p.t)).join("")}</div></section>
  <section class="blk"><h2>Plus tard : après un mois de contenu</h2><p class="prose">Quand tu as publié régulièrement pendant quelques semaines, ces prompts t'aident à voir ce qui marche. Avec l'icône d'horloge du panneau, tu peux en programmer un chaque semaine. Il roule seulement quand Chrome est ouvert.</p><div class="grid">${CHROME_PROMPTS.map(p=>script(p.who,p.t)).join("")}</div></section>

  </div><p class="ref">Tu restes responsable de tout ce que Claude fait dans ton navigateur, y compris ce qui est publié ou envoyé.</p></section>`)+lessons(m)+nav(m);
},
dm(m){

  `<section class="blk"><h2>Les règles</h2><div class="vs">

},
cap(m){
  return head(m,"Créer du contenu qui attire et crée la relation. Amener les personnes intéressées vers la bonne information, puis personnaliser le suivi.")+
  `<section class="blk"><h2>Les trois étapes</h2><div class="rule3">
   <div class="card"><span class="meta">C — Créer</span><b>Du contenu qui attire</b><p>Attire les bonnes personnes en partageant ton univers, ton vécu et tes découvertes. Le lien se construit avant la présentation.</p></div>
   <div class="card"><span class="meta">A — Amener à demander</span><b>La bonne information</b><p>Invite à poser une question ou à en savoir plus. Oriente ensuite vers la ressource adaptée : produits ou activité.</p></div>
   <div class="card"><span class="meta">P — Personnaliser</span><b>Un suivi humain</b><p>Écoute ce que la personne cherche, réponds à ses questions et conviens d’un suivi si elle le souhaite.</p></div>

},
conformite(m){
  return head(m,"Ce module protège ton équipe et ta réputation. On le prend au sérieux.")+
  `<section class="blk"><h2>Allégations santé</h2><div class="vs">
   <div class="card"><span class="sticker st-ok">On peut</span><ul>
    <li>Parler de ta routine, de ton expérience honnête, du goût, de la texture, de l'origine et des ingrédients.</li>
    <li>Reprendre les allégations de la fiche Partner.Co seulement si elles sont autorisées au Canada pour ce produit précis.</li>
    <li>Dire « soutient la santé des articulations » ou « aide à gérer le stress » uniquement si cette formulation est autorisée pour le produit. Pour un cosmétique, parler d'apparence ou de sensation — par exemple « ma peau est plus douce » — si c'est vrai et conforme à sa fiche.</li>
    <li>Partager un témoignage réel avec l'accord écrit de la personne, sans en changer le sens et sans dépasser les allégations autorisées.</li>
    <li>Partager des photos avant/après réelles avec l'accord écrit de la personne, un contexte honnête et une transformation que le produit est autorisé à revendiquer.</li>
   </ul></div>
   <div class="card"><span class="sticker st-no">On peut pas</span><ul>
    <li>Dire qu'un produit guérit, traite ou prévient une maladie, ou qu'il a réglé l'arthrite, l'anxiété ou l'acné.</li>
    <li>Dépasser l'allégation autorisée au Canada, même si une fiche ou un contenu général de la compagnie emploie des mots plus larges.</li>
    <li>Comparer un produit à un médicament ou conseiller d'arrêter un traitement.</li>
    <li>Utiliser une photo, un témoignage ou « les résultats varient » pour suggérer un effet non autorisé, garanti ou trompeur.</li>
   </ul></div>
  </div><p class="ref">« Les résultats varient d'une personne à l'autre » ne rend pas conforme une allégation qui n'est pas autorisée ou qui donne une impression trompeuse.</p></section>
  <section class="blk"><h2>Revenus et recrutement</h2><div class="vs">
   <div class="card"><span class="sticker st-ok">On peut</span><ul>
    <li>Parler de tes motivations et de tes objectifs personnels — voyager davantage, changer de voiture ou financer les études — sans les présenter comme des résultats garantis ou typiques.</li>
    <li>Expliquer comment le plan fonctionne avec les documents officiels, et parler du temps et des efforts nécessaires.</li>
    <li>Raconter ce qu'un revenu supplémentaire réel t'a permis de faire — voyager davantage, acheter la voiture que tu voulais ou financer les études — seulement avec la divulgation officielle sur la rémunération des participantes typiques, présentée clairement à proximité.</li>
   </ul></div>
   <div class="card"><span class="sticker st-no">On peut pas</span><ul>
    <li>Promettre un revenu, une « liberté financière » ou que le plan paiera un voyage, une voiture ou l'école privée.</li>
    <li>Dans nos contenus d'équipe, ne donne pas de montants de gains personnels ou ceux d'une autre participante, ni de captures de paies ou de chèques.</li>
    <li>Laisser croire que les résultats d'une personne sont typiques ou accessibles à tout le monde.</li>
   </ul></div>
  </div><p class="ref">Attention : associer un voyage, une voiture, l'école privée ou une amélioration de qualité de vie aux revenus du plan peut compter comme une représentation de gains, même sans montant précis. Au Canada, ces représentations doivent être accompagnées d'une information loyale, raisonnable et présentée au bon moment sur la rémunération réellement reçue ou susceptible de l'être par les participantes typiques. Une histoire vraie ou l'absence de chiffres personnels ne remplace pas cette divulgation. Utilise les données officielles de Partner.Co; sans elles, ne présente pas ces dépenses comme un résultat du plan. <a href="https://laws-lois.justice.gc.ca/fra/lois/C-34/section-55.html" target="_blank" rel="noopener">Loi sur la concurrence, art. 55 ↗</a> · <a href="https://competition-bureau.canada.ca/en/how-we-foster-competition/education-and-outreach/publications/multi-level-marketing-plans-and-schemes-pyramid-selling" target="_blank" rel="noopener">Guide du Bureau de la concurrence sur les plans multiniveaux ↗</a></p></section>
  <section class="blk"><h2>Comment vérifier une allégation</h2><div class="prose"><p><a href="https://cdn.buttercms.com/4wqKeysQoyn7XCLBrSZA" target="_blank" rel="noopener">Guide Partner.Co : allégations et exemples de formulations ↗</a>. Il propose aussi des façons de parler d'un revenu d'appoint avec renvoi au rapport de divulgation des revenus.</p><p>La fiche technique Partner.Co est un bon point de départ, mais utilise seulement une formulation autorisée au Canada pour le produit exact. Pour un produit de santé naturel, compare-la aux conditions de son autorisation canadienne et à son NPN.</p><p><a href="https://www.canada.ca/en/health-canada/services/drugs-health-products/marketing-drugs-devices/illegal-marketing/health-providers/natural-non-prescription.html" target="_blank" rel="noopener">Règles de Health Canada sur les allégations des produits de santé naturels ↗</a></p><p><a href="https://competition-bureau.canada.ca/en/deceptive-marketing-practices/types-deceptive-marketing-practices/use-tests-or-testimonials" target="_blank" rel="noopener">Règles du Bureau de la concurrence sur les témoignages et le consentement écrit ↗</a></p><p><a href="https://competition-bureau.canada.ca/en/deceptive-marketing-practices/types-deceptive-marketing-practices/advertising-dos-and-donts" target="_blank" rel="noopener">Conseils sur les avertissements et les impressions trompeuses ↗</a></p></div></section>`+lessons(m)+nav(m);
},

function makeZip(files){
  const T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0;}
  const crc=d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=T[(c^d[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  const enc=new TextEncoder();const parts=[],cent=[];let off=0;
  const dirs=[...new Set(files.map(f=>f.name.split("/")[0]+"/"))].map(n=>({name:n,data:new Uint8Array(0)}));
  for(const f of [...dirs,...files]){
    const nm=enc.encode(f.name),c=crc(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x5821,true);h.setUint32(14,c,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x5821,true);ch.setUint32(16,c,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(38,f.name.endsWith("/")?16:0,true);ch.setUint32(42,off,true);
    cent.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz;}
  const cs=cent.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));const n=dirs.length+files.length;
  e.setUint32(0,0x06054b50,true);e.setUint16(8,n,true);e.setUint16(10,n,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cent,new Uint8Array(e.buffer)],{type:"application/zip"});
}

  let bin="";out.forEach(b=>bin+=String.fromCharCode(b));return (window.CompressionStream?"z":"p")+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}

  return new TextDecoder().decode(bytes);}

  state.seen=[...new Set([...(sv.seen||[]),...(state.seen||[])])];
  ["brand","yisPhase","last"].forEach(k=>{if(state[k]==null&&sv[k]!=null)state[k]=sv[k];});
  if((!state.interests||!state.interests.length||(state.interests.length===1&&state.interests[0]==="sante"))&&Array.isArray(sv.interests)&&sv.interests.length)state.interests=sv.interests;
}
async function acctVerify(token){
  history.replaceState(null,"","#accueil");
  try{const r=await fetch("/api/verify",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({token})});const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){ACCT.email=j.email;mergeState(j.state);ACCT.msg="Bienvenue! Tu es connectée et ta progression est synchronisée.";save();acctPush();}
    else ACCT.msg="Ce lien a expiré ou a déjà servi. Entre ton courriel pour en recevoir un nouveau.";}
  catch(e){ACCT.msg="La connexion n'a pas fonctionné. Réessaie dans un instant.";}
  render();window.scrollTo(0,0);
}
async function acctInit(){
  try{const r=await fetch("/api/me",{credentials:"same-origin",cache:"no-store"});if(!r.ok)return;
    const ct=r.headers.get("content-type")||"";if(!ct.includes("json"))return;const j=await r.json();if(!j||j.ok!==true)return;
    ACCT.avail=true;ACCT.email=j.auth?j.email:null;
    if(location.hash.startsWith("#login=")){await acctVerify(location.hash.slice(7));return;}
    if(ACCT.email){const g=await fetch("/api/progress",{credentials:"same-origin",cache:"no-store"});const pj=await g.json().catch(()=>({}));if(pj&&pj.ok){mergeState(pj.state);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}acctPush();openGroups=new Set(Array.isArray(state.open)?state.open:[]);render();return;}}
    acctRefresh();
  }catch(e){}
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="acct-form")return;e.preventDefault();
  const email=document.getElementById("acct-email").value.trim(),prenom=document.getElementById("acct-prenom").value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ACCT.msg="Vérifie ton adresse courriel.";acctRefresh();return;}
  ACCT.busy=true;ACCT.msg="";acctRefresh();
  try{const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({email,prenom})});
    ACCT.msg=r.ok?`C'est envoyé! Regarde tes courriels (${email}) et clique sur le bouton « Ouvrir mon Académie ». Le lien est valide 15 minutes. Pense à vérifier tes indésirables.`:(r.status===429?"Tu as demandé plusieurs liens de suite. Attends quelques minutes avant de réessayer.":"L'envoi n'a pas fonctionné. Réessaie dans un instant.");}
  catch(err){ACCT.msg="L'envoi n'a pas fonctionné. Vérifie ta connexion Internet.";}
  ACCT.busy=false;acctRefresh();
});
document.addEventListener("click",async e=>{
  if(!(e.target.closest&&e.target.closest("#acct-out")))return;
  try{await fetch("/api/logout",{method:"POST",credentials:"same-origin"});}catch(err){}
  ACCT.email=null;ACCT.msg="Tu es déconnectée. Ta progression reste aussi sur cet appareil.";acctRefresh();
});
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y);}
window.addEventListener("hashchange",()=>{if(ACCT.avail&&location.hash.startsWith("#login=")){acctVerify(location.hash.slice(7));return;}render();window.scrollTo(0,0);checkSyncHash();});
function setTopH(){const t=document.querySelector(".top");if(t)document.documentElement.style.setProperty("--top-h",t.getBoundingClientRect().height+"px");}
window.addEventListener("resize",setTopH);setTimeout(setTopH,0);
render();
checkSyncHash();
acctInit();
</script>

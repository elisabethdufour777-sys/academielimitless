#lt-quiz .ring small{display:block;font:500 12px Inter,sans-serif;color:var(--muted);margin-top:2px}
#lt-quiz .pb{margin:12px 0}
#lt-quiz .pb .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
#lt-quiz .pb .l em{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
#lt-quiz .pb .t{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
#lt-quiz .pb .t i{display:block;height:100%;border-radius:99px}
#lt-quiz .lv-bon{background:#ebe7e1;color:#1a1816}
#lt-quiz .lv-moy{background:#f3e9dc;color:#86603a}

#lt-quiz .prio{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
#lt-quiz .prio:first-of-type{border-top:0;padding-top:4px}
#lt-quiz .prio .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--sage-d);color:#fff;display:grid;place-items:center;font-weight:600}
#lt-quiz .prio h4{margin:2px 0 6px;font-size:16px}
#lt-quiz .prio p{font-size:15px;color:var(--muted);margin:0 0 6px}
#lt-quiz .prio .g{color:var(--ink);font-size:15px}
#lt-quiz .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){#lt-quiz .grid2{grid-template-columns:1fr}}
#lt-quiz .rt{background:var(--sage-s);border-radius:12px;padding:14px}
#lt-quiz .rt b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--bronze-t);margin-bottom:6px}
#lt-quiz ol,#lt-quiz ul{margin:0;padding-left:20px}
#lt-quiz li{margin-bottom:6px}
#lt-quiz .tip{border-left:3px solid var(--bronze);padding:10px 14px;background:var(--rose-s);border-radius:0 10px 10px 0;margin-top:12px;font-size:15px}
#lt-quiz .launch{border-color:var(--bronze);background:var(--bg)}
#lt-quiz .launch .kick{margin-bottom:6px}
#lt-quiz .form-slot{margin-top:16px;border-radius:12px;overflow:hidden;background:#fff}
#lt-quiz .form-slot iframe{width:100%;border:0;min-height:520px;display:block}
#lt-quiz .placeholder{padding:18px;color:var(--muted);font-size:14px;border:1.5px dashed var(--bronze);border-radius:12px;background:transparent}
#lt-quiz .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
#lt-quiz .small{font-size:12px;color:var(--muted);margin-top:14px}
</style>
<script>
(function(){
/* ================= CONFIG ================= */
const CONFIG={
  nom:"Eli Dufour",                    // affiché sur la carte « Mon bilan peau »
  marque:"Style de vie Lowtox",
  photo:"",                            // URL d'une photo carrée (optionnel) pour la carte
  // Lien du formulaire GHL (le src de l'iframe dans le code « Embed » de GHL).
  // Laisse vide tant que le formulaire n'est pas créé : un encadré l'indiquera.
  ghlFormUrl:"",
  // Clés des champs cachés dans GHL (paramètres d'URL qui les préremplissent).
  ghlChampProfil:"profil_de_peau",
  ghlChampScore:"indice_peau",
  ghlChampPriorites:"priorites_peau"
};
/* ========================================== */

/* Les 5 piliers évalués */
const PIL={
  h:{n:"Hydratation"},
  b:{n:"Barrière cutanée"},
  v:{n:"Mode de vie"},
  p:{n:"Protection"},
  r:{n:"Routine"}
};
/* Les sections du bilan */
const SEC=["Ta peau aujourd'hui","Hydratation et alimentation","Sommeil, stress et hormones","Ton environnement","Ta routine actuelle"];

/* Questions. Chaque choix : [texte, points de profil, points perdus par pilier, priorité déclenchée] */
const Q=[
 {s:0,q:"En fin de journée, ta peau est plutôt…",o:[
   ["Confortable, je n'y pense pas",{},{}],
   ["Tiraillée, comme si elle manquait d'eau",{A:2},{h:2}],
   ["Luisante sur le front et le nez, mais tiraillée ailleurs",{A:1},{h:1}],
   ["Luisante sur tout le visage",{A:1},{}],
   ["Rouge ou inconfortable par endroits",{F:2},{b:2}],
   ["Terne et fatiguée",{E:2},{}],
   ["Je ne sais pas",{},{}]]},
 {s:0,q:"Quand tu essaies un nouveau produit, ta peau réagit (picotements, rougeurs, boutons)…",o:[
   ["Jamais",{},{}],
   ["Rarement",{},{}],
   ["Parfois",{F:1},{b:1}],
   ["Souvent",{F:2},{b:3}],
   ["Je ne sais pas, je change rarement de produits",{},{}]]},
 {s:0,q:"Ce qui te préoccupe le plus pour ta peau en ce moment?",o:[
   ["Les ridules, surtout en fin de journée",{A:2},{}],
   ["Le manque d'éclat, un teint terne",{E:2},{}],
   ["Les taches ou un teint inégal",{E:1,R:1},{p:1}],
   ["Les rougeurs ou l'inconfort",{F:2},{}],
   ["La perte de fermeté et de rebond",{R:2},{}],
   ["Les imperfections (boutons, pores)",{F:1},{}],
   ["Rien de particulier, je veux en prendre soin",{},{}]]},
 {s:0,q:"L'hiver ou au changement de saison, ta peau…",o:[
   ["Ne change pas",{},{}],
   ["Devient un peu plus sèche",{A:1},{h:1}],
   ["Devient beaucoup plus sèche et tiraille",{A:2},{h:2,p:1}],
   ["Devient plus sensible, rouge ou irritée",{F:1},{b:1,p:1}],
   ["Je n'ai jamais remarqué",{},{}]]},

 {s:1,q:"Combien de verres d'eau bois-tu par jour, en moyenne?",w:"Un verre = 250 ml. Les tisanes et l'eau citronnée comptent.",o:[
   ["Moins de 2",{A:1},{h:4},"eau"],
   ["2 à 3",{A:1},{h:3},"eau"],
   ["4 à 5",{},{h:1},"eau"],
   ["6 à 8",{},{}],
   ["Plus de 8",{},{}],
   ["Je ne sais pas",{},{h:1},"eau"]]},
 {s:1,q:"Combien de cafés, thés noirs ou boissons énergisantes par jour?",o:[
   ["Aucun",{},{}],
   ["1",{},{}],
   ["2 ou 3",{},{h:1}],
   ["4 et plus",{A:1},{h:2},"cafe"]]},
 {s:1,q:"Combien de consommations d'alcool par semaine, en moyenne?",o:[
   ["Aucune",{},{}],
   ["Moins d'une",{},{}],
   ["1 à 3",{},{}],
   ["4 à 7",{},{h:1,v:1},"alcool"],
   ["Plus de 7",{A:1,F:1},{h:2,v:2},"alcool"]]},
 {s:1,q:"Combien de portions de fruits et légumes manges-tu par jour?",w:"Une portion = environ une poignée ou une demi-tasse.",o:[
   ["5 et plus",{},{}],
   ["3 ou 4",{},{v:1}],
   ["1 ou 2",{E:1},{v:2},"fl"],
   ["Moins d'une",{E:1},{v:3},"fl"]]},
 {s:1,q:"À quelle fréquence manges-tu du sucre ou des aliments transformés (desserts, boissons sucrées, grignotines)?",o:[
   ["Rarement ou jamais",{},{}],
   ["1 ou 2 fois par semaine",{},{}],
   ["3 à 5 fois par semaine",{},{v:1}],
   ["Tous les jours",{E:1,R:1},{v:2},"sucre"],
   ["Plusieurs fois par jour",{E:1,R:1},{v:3},"sucre"]]},
 {s:1,q:"À quelle fréquence manges-tu de bons gras (avocat, noix, graines, poissons gras, huile d'olive)?",o:[
   ["Tous les jours",{},{}],
   ["3 à 5 fois par semaine",{},{}],
   ["1 ou 2 fois par semaine",{},{b:1},"gras"],
   ["Rarement ou jamais",{A:1},{b:2,v:1},"gras"]]},

 {s:2,q:"Combien d'heures dors-tu par nuit, en moyenne?",o:[
   ["Moins de 5",{E:2},{v:3},"sommeil"],
   ["5 à 6",{E:1},{v:2},"sommeil"],
   ["6 à 7",{},{v:1}],
   ["7 à 8",{},{}],
   ["Plus de 8",{},{}]]},
 {s:2,q:"Le matin, tu te réveilles reposée…",o:[
   ["Presque toujours",{},{}],
   ["Souvent",{},{}],
   ["Parfois",{},{v:1}],
   ["Rarement",{E:1},{v:2},"sommeil"]]},
 {s:2,q:"Comment décrirais-tu ton niveau de stress ces dernières semaines?",o:[
   ["Très bas",{},{}],
   ["Bas",{},{}],
   ["Modéré",{},{v:1}],
   ["Élevé",{F:1,E:1},{v:2},"stress"],
   ["Très élevé",{F:1,E:1},{v:3},"stress"]]},
 {s:2,q:"Où en es-tu dans ta vie hormonale?",w:"Les hormones influencent beaucoup la peau.",o:[
   ["Cycles réguliers",{},{}],
   ["Cycles irréguliers",{},{}],
   ["Grossesse ou allaitement",{},{},"enceinte"],
   ["Périménopause (cycles qui changent, chaleurs)",{R:1,A:1},{h:1},"hormones"],
   ["Ménopause",{R:2},{h:1,b:1},"hormones"],
   ["Je ne sais pas",{},{}],
   ["Je préfère ne pas répondre",{},{}]]},
 {s:2,q:"Quel âge as-tu?",o:[
   ["Moins de 25 ans",{E:1},{}],
   ["25 à 34 ans",{E:1},{}],
   ["35 à 44 ans",{A:1},{}],
   ["45 à 54 ans",{R:2},{}],
   ["55 à 64 ans",{R:3},{}],
   ["65 ans et plus",{R:3},{}]]},

 {s:3,q:"À quelle fréquence mets-tu une protection solaire au visage?",o:[
   ["Tous les jours, même en hiver",{},{}],
   ["La plupart des jours",{},{p:1}],
   ["Seulement l'été ou quand il fait soleil",{},{p:2},"spf"],
   ["Rarement",{R:1},{p:3},"spf"],
   ["Jamais",{R:1},{p:4},"spf"]]},
 {s:3,q:"Tes journées se passent surtout…",o:[
   ["À l'intérieur, dans un endroit chauffé ou climatisé",{A:1},{h:1,p:1},"air"],
   ["Dehors, au froid, au vent ou au soleil",{A:1},{p:2},"dehors"],
   ["Un mélange des deux",{},{p:1}],
   ["À la maison, dans un environnement assez stable",{},{}]]},
 {s:3,q:"La température de tes douches, c'est plutôt…",o:[
   ["Très chaude",{A:1},{h:2,b:1},"douche"],
   ["Chaude",{},{h:1}],
   ["Tiède",{},{}],
   ["Fraîche",{},{}]]},
 {s:3,q:"La fumée de cigarette, pour toi…",o:[
   ["Je ne fume pas et n'y suis pas exposée",{},{}],
   ["Je suis parfois exposée à la fumée des autres",{},{p:1}],
   ["Je fume ou vapote à l'occasion",{E:1},{p:2,v:1},"tabac"],
   ["Je fume ou vapote tous les jours",{R:1,E:1},{p:3,v:2},"tabac"]]},

 {s:4,q:"Combien de produits utilises-tu sur ton visage, au total?",w:"Nettoyant, sérum, crème, contour des yeux, masque, huile, etc.",o:[
   ["Aucun",{A:1},{r:2}],
   ["1 ou 2",{A:1},{r:1}],
   ["3 ou 4",{},{}],
   ["5 ou 6",{},{r:1}],
   ["7 et plus",{F:1},{r:2,b:1},"trop"]]},
 {s:4,q:"À quelle fréquence te nettoies-tu le visage le soir?",o:[
   ["Tous les soirs",{},{}],
   ["La plupart des soirs",{},{}],
   ["Environ un soir sur deux",{},{r:2},"soir"],
   ["Rarement",{E:1},{r:3},"soir"],
   ["Jamais",{E:1},{r:4},"soir"]]},
 {s:4,q:"Pour te nettoyer le visage, tu utilises surtout…",o:[
   ["Un savon ou un nettoyant moussant qui laisse la peau « squeaky clean »",{A:1,F:1},{b:2},"nettoyant"],
   ["Des lingettes démaquillantes",{F:1},{b:1,r:1},"nettoyant"],
   ["Un nettoyant doux, une huile, un baume ou un lait",{},{}],
   ["De l'eau seulement",{},{}],
   ["Je ne sais pas",{},{r:1}]]},
 {s:4,q:"À quelle fréquence exfolies-tu ta peau (grains, acides, brosse)?",o:[
   ["Jamais",{E:1},{}],
   ["Moins d'une fois par mois",{},{}],
   ["1 à 3 fois par mois",{},{}],
   ["1 ou 2 fois par semaine",{},{}],
   ["3 fois et plus par semaine",{F:2},{b:3},"exfo"],
   ["Je ne sais pas si mes produits exfolient",{},{r:1},"etiquettes"]]},
 {s:4,q:"Tes soins visage contiennent du parfum?",o:[
   ["Non, je les choisis sans parfum",{},{}],
   ["Quelques-uns",{},{b:1}],
   ["La plupart",{F:1},{b:2},"parfum"],
   ["Je ne sais pas",{},{r:1},"etiquettes"]]},
 {s:4,q:"À quelle fréquence lis-tu la liste d'ingrédients avant d'acheter un soin?",o:[
   ["Toujours",{},{}],
   ["Souvent",{},{}],
   ["Parfois",{},{r:1}],
   ["Rarement ou jamais",{},{r:2},"etiquettes"]]}
];

/* Priorités personnalisées, déclenchées par les réponses. w = importance */
const PR={
 spf:{w:10,t:"Protection solaire tous les jours",p:"Le soleil est le premier facteur extérieur du vieillissement visible de la peau, même en hiver et même par temps gris.",g:"Ajoute une protection solaire FPS 30 et plus chaque matin, en dernière étape. Choisis une formule minérale si ta peau est sensible."},
 tabac:{w:10,t:"Réduire la fumée",p:"La fumée réduit l'apport d'oxygène à la peau et accélère la perte de fermeté et d'éclat.",g:"Chaque cigarette en moins compte. Si tu veux arrêter, ta pharmacienne peut t'accompagner."},
 eau:{w:9,t:"Boire 6 à 8 verres d'eau",p:"L'hydratation se joue aussi de l'intérieur. Quand tu bois peu, la peau a tendance à paraître plus terne et à mieux marquer les ridules.",g:"Garde une gourde à portée de main et bois un grand verre d'eau au réveil, avant ton café."},
 sommeil:{w:9,t:"Protéger ton sommeil",p:"C'est la nuit que la peau se répare et se renouvelle. Les nuits courtes se voient vite : teint terne, cernes, peau plus réactive.",g:"Écrans fermés 30 minutes avant de dormir, chambre fraîche, et vise une heure de coucher régulière."},
 exfo:{w:8,t:"Exfolier moins souvent",p:"Trop exfolier affaiblit la barrière de la peau : elle perd son eau plus vite et devient sensible.",g:"Maximum 1 à 2 fois par semaine, et fais une pause complète de 2 semaines si ta peau picote."},
 nettoyant:{w:8,t:"Un nettoyant plus doux",p:"La sensation « squeaky clean », c'est souvent le signe qu'on a retiré les lipides protecteurs de la peau.",g:"Passe à un nettoyant doux, une huile ou un lait. Ta peau devrait être confortable, jamais tiraillée, après le nettoyage."},
 stress:{w:7,t:"Faire baisser le stress",p:"Le stress chronique peut rendre la peau plus réactive, plus terne et plus lente à se rétablir.",g:"5 minutes par jour : respiration lente, marche dehors ou étirements. Fais de ta routine du soir un vrai moment pour toi."},
 soir:{w:7,t:"Nettoyer ta peau chaque soir",p:"La nuit, ta peau se répare mieux quand elle est débarrassée du maquillage, de la pollution et de l'écran solaire de la journée.",g:"Garde un nettoyant doux près du lit pour les soirs de fatigue : 30 secondes suffisent."},
 hormones:{w:7,t:"Adapter ta routine à tes hormones",p:"Avec la baisse des œstrogènes, la peau devient souvent plus sèche, plus mince et moins rebondie. Elle a besoin de plus d'hydratation et de soins qui renforcent la barrière.",g:"Mise sur des textures plus nourrissantes, applique jusqu'au cou et au décolleté, et parles-en à ta professionnelle de la santé si tu as des inquiétudes."},
 trop:{w:6,t:"Simplifier ta routine",p:"Plus de produits ne veut pas dire de meilleurs résultats. Les mélanges d'actifs peuvent irriter et rendre difficile de savoir ce qui fonctionne.",g:"Garde 3 ou 4 produits essentiels pendant 2 semaines et observe ta peau."},
 alcool:{w:6,t:"Moins d'alcool, plus d'eau",p:"L'alcool déshydrate et peut accentuer les rougeurs et la fatigue du teint le lendemain.",g:"Alterne chaque verre d'alcool avec un verre d'eau, et garde quelques soirs sans alcool dans la semaine."},
 fl:{w:6,t:"Plus de couleurs dans ton assiette",p:"Les fruits et légumes apportent des antioxydants et de la vitamine C, qui contribuent à la formation du collagène et à l'éclat de la peau.",g:"Ajoute une portion de fruits ou de légumes à chaque repas, en visant le plus de couleurs possible."},
 sucre:{w:5,t:"Moins de sucre au quotidien",p:"Le sucre en excès est associé à la glycation, un processus qui peut affecter la souplesse et la fermeté de la peau avec le temps.",g:"Commence par remplacer une collation sucrée par des noix, un fruit ou un yogourt nature."},
 gras:{w:5,t:"Des bons gras chaque jour",p:"Les bons gras aident la peau à fabriquer son ciment protecteur, celui qui retient l'hydratation.",g:"Ajoute une poignée de noix, un demi-avocat ou une cuillère de graines de lin ou de chia dans ta journée."},
 douche:{w:5,t:"Des douches plus tièdes",p:"L'eau très chaude retire les lipides protecteurs de la peau et la laisse plus sèche et tiraillée.",g:"Baisse un peu la température, raccourcis la douche et applique ton soin dans la minute qui suit, sur peau encore humide."},
 air:{w:5,t:"Contrer l'air sec",p:"Le chauffage et la climatisation font baisser l'humidité de l'air, et ta peau perd son eau plus vite.",g:"Un humidificateur au bureau ou dans la chambre, et une brume hydratante pendant la journée."},
 dehors:{w:5,t:"Protéger ta peau dehors",p:"Le froid, le vent et le soleil fragilisent la barrière de la peau.",g:"Une crème plus protectrice les jours de grand froid, et la protection solaire même l'hiver."},
 etiquettes:{w:4,t:"Apprendre à lire tes étiquettes",p:"Certains ingrédients, comme le parfum synthétique, sont une source fréquente d'irritation et de perturbateurs potentiels.",g:"Commence par repérer le mot « parfum » ou « fragrance » dans la liste d'ingrédients de tes produits visage."},
 parfum:{w:6,t:"Choisir des produits sans parfum",p:"Le parfum est l'une des causes les plus fréquentes de réactions et de sensibilité au visage.",g:"Pour les soins qui restent sur la peau (sérum, crème), choisis des versions sans parfum ajouté."}
};

/* Les 4 profils */
const P={
 A:{nom:"Ta peau est assoiffée",court:"Peau assoiffée",
   expl:"Ta peau n'est pas forcément sèche : elle est déshydratée. Elle manque d'eau, pas d'huile. C'est pour ça qu'une crème riche ne règle pas toujours le problème, et que tes ridules ressortent plus en fin de journée.",
   matin:["Nettoyage doux, ou juste de l'eau","Soin hydratant sur la peau encore humide","Protection solaire"],
   soir:["Nettoyant doux","Sérum hydratant","Crème pour sceller"]},
 F:{nom:"Ta barrière cutanée est fragilisée",court:"Barrière fragilisée",
   expl:"La barrière de ta peau, c'est son mur de protection. Quand il est affaibli, ta peau perd son eau plus vite et réagit à tout : picotements, rougeurs, inconfort. Souvent, ce n'est pas qu'elle manque de produits, c'est qu'elle en reçoit trop.",
   matin:["De l'eau ou un nettoyant très doux","Hydratant apaisant","Protection solaire minérale"],
   soir:["Nettoyant doux","Hydratant réparateur","C'est tout, pendant 2 semaines"]},
 E:{nom:"Ton éclat est en pause",court:"Éclat en pause",
   expl:"Ta peau va bien, mais elle a l'air fatiguée. Souvent, c'est un mélange de manque d'hydratation, de sommeil et de cellules mortes qui s'accumulent. La bonne nouvelle : c'est le profil qui répond le plus vite.",
   matin:["Nettoyant doux","Sérum hydratant","Protection solaire"],
   soir:["Nettoyant","Sérum puis crème","Exfoliation douce 1 à 2 fois par semaine maximum"]},
 R:{nom:"Ta peau cherche son rebond",court:"Peau qui cherche son rebond",
   expl:"Avec les années, la peau devient naturellement moins rebondie et plus mince. Ce n'est pas toujours un manque d'actifs puissants : une peau bien hydratée et bien protégée paraît tout de suite plus lisse et plus pleine.",
   matin:["Nettoyant doux","Sérum hydratant","Crème raffermissante","Protection solaire"],
   soir:["Nettoyant","Sérum","Crème plus généreuse, jusqu'au cou"]}
};
const ORDER=["F","A","R","E"]; // priorité des profils en cas d'égalité
/* Si moins de 3 priorités sont déclenchées, on complète avec des gestes d'entretien selon le profil */
const ENTRETIEN={
 A:[{w:0,t:"Hydrater sur peau humide",p:"Une peau encore humide retient beaucoup mieux l'hydratation que tu lui apportes.",g:"Applique ton sérum ou ta crème dans la minute qui suit le nettoyage ou la douche."},
    {w:0,t:"Une brume pendant la journée",p:"Ta peau a tendance à manquer d'eau en fin de journée.",g:"Une brume hydratante au bureau ou en après-midi, puis tapote pour faire pénétrer."}],
 F:[{w:0,t:"Un seul nouveau produit à la fois",p:"Ta peau est plus réactive que la moyenne : il faut pouvoir repérer ce qui lui convient.",g:"Introduis chaque nouveau soin seul, pendant au moins 2 semaines, et teste-le d'abord dans le cou."},
    {w:0,t:"Tamponner, ne plus frotter",p:"La friction suffit à irriter une barrière fragile.",g:"Sèche ton visage en tamponnant avec une serviette douce et propre."}],
 E:[{w:0,t:"Masser en appliquant",p:"Le massage réveille le teint et rend ta routine plus agréable.",g:"30 secondes de massage du visage en appliquant ta crème, du centre vers l'extérieur."},
    {w:0,t:"Une taie d'oreiller propre",p:"Ta peau passe 7 à 8 heures par nuit contre ta taie d'oreiller.",g:"Change-la 2 fois par semaine, idéalement pour une taie en soie ou en coton doux."}],
 R:[{w:0,t:"Jusqu'au cou et au décolleté",p:"C'est souvent là que la perte de rebond paraît en premier, et on l'oublie.",g:"Applique chaque soin jusqu'au cou et au décolleté, en remontant."},
    {w:0,t:"Dormir sur le dos",p:"Les plis de l'oreiller marquent plus longtemps une peau moins rebondie.",g:"Quand tu peux, dors sur le dos, ou choisis une taie en soie."}]
};
const ENCEINTE="Tu es enceinte ou tu allaites : avant d'ajouter un nouveau produit à ta routine, vérifie avec ta professionnelle de la santé.";

const root=document.getElementById("lt-quiz");
let i=0,ans=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const top=()=>{const r=root.getBoundingClientRect();if(r.top<0)window.scrollTo({top:window.scrollY+r.top-16,behavior:"smooth"});};

function intro(){
  root.innerHTML=`<div class="kick">${esc(CONFIG.marque)} · Bilan peau</div>
  <h1>Ton bilan peau complet</h1>
  <p class="lead">Ta peau ne dépend pas que de tes crèmes. Ce que tu bois, ton sommeil, ton stress, tes hormones et ton environnement comptent autant. Ce bilan regarde tout ça.</p>
  <div class="pillars">${Object.values(PIL).map(p=>`<div class="pill">${esc(p.n)}</div>`).join("")}</div>
  <div class="card"><b>À la fin, tu reçois :</b><ul style="margin-top:8px"><li>Ton indice peau sur 100 et ton score pour chacun des 5 piliers</li><li>Ton profil de peau, expliqué simplement</li><li>Tes 3 priorités, choisies selon tes réponses</li><li>Ta routine simplifiée, matin et soir, à enregistrer</li></ul></div>
  <div class="actions"><button class="btn" data-go>Commencer mon bilan</button></div>
  <p class="small">${Q.length} questions, environ 4 minutes. Ton résultat est gratuit et s'affiche tout de suite.</p>`;
  root.querySelector("[data-go]").onclick=()=>{i=0;ans=[];ask();top();};
}
function ask(){
  const it=Q[i];
  root.innerHTML=`<div class="sec"><span><b>${it.s+1}/${SEC.length}</b> · ${esc(SEC[it.s])}</span><span>${i+1} sur ${Q.length}</span></div>
  <div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div>
  <h2>${esc(it.q)}</h2>${it.w?`<p class="why">${esc(it.w)}</p>`:""}
  <div class="opts">${it.o.map((o,k)=>`<button class="opt ${ans[i]===k?"sel":""}" data-k="${k}">${esc(o[0])}</button>`).join("")}</div>
  ${i?'<button class="back" data-back>← Question précédente</button>':""}`;
  root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;i++;i<Q.length?ask():courriel();top();});
  const bk=root.querySelector("[data-back]");if(bk)bk.onclick=()=>{i--;ask();};
}
function compute(){
  const prof={A:0,F:0,E:0,R:0},lost={h:0,b:0,v:0,p:0,r:0},max={h:0,b:0,v:0,p:0,r:0},flags=new Set();
  Q.forEach((q,qi)=>{
    Object.keys(max).forEach(k=>{max[k]+=Math.max(...q.o.map(o=>(o[2]||{})[k]||0));});
    const o=q.o[ans[qi]];
    Object.entries(o[1]).forEach(([k,v])=>prof[k]+=v);
    Object.entries(o[2]).forEach(([k,v])=>lost[k]+=v);
    if(o[3])flags.add(o[3]);
  });
  const sc={};Object.keys(max).forEach(k=>sc[k]=max[k]?Math.round(100*(1-lost[k]/max[k])):100);
  const indice=Math.round(Object.values(sc).reduce((a,b)=>a+b,0)/5);
  const m=Math.max(...Object.values(prof));const p=m?ORDER.find(k=>prof[k]===m):"E";
  const enceinte=flags.delete("enceinte");
  let pr=[...flags].filter(f=>PR[f]).sort((a,b)=>PR[b].w-PR[a].w).map(f=>PR[f]);
  for(const e of ENTRETIEN[p]){if(pr.length>=3)break;pr.push(e);}
  if(pr.length<3)pr.push({t:"Garder le cap",p:"Tes habitudes sont déjà excellentes : ta peau te remercie.",g:"Continue exactement ce que tu fais, et refais ce bilan dans 3 mois ou au changement de saison."});
  return {p,sc,indice,pr:pr.slice(0,3),enceinte};
}
function ghlUrl(R,r){
  if(!CONFIG.ghlFormUrl)return "";
  return CONFIG.ghlFormUrl+(CONFIG.ghlFormUrl.includes("?")?"&":"?")+[[CONFIG.ghlChampProfil,r.court],[CONFIG.ghlChampScore,R.indice],[CONFIG.ghlChampPriorites,R.pr.map(f=>f.t).join(" | ")]].map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
}
/* Page intermédiaire : le courriel pour recevoir les résultats */
function courriel(){
  const R=compute(),r=P[R.p],url=ghlUrl(R,r);
  root.innerHTML=`<div class="kick">Ton bilan est prêt</div>
  <h1>Où veux-tu recevoir tes résultats?</h1>
  <p class="lead">Inscris ton prénom et ton courriel : je t'envoie ton bilan complet, pour que tu puisses le garder et y revenir.</p>
  <div class="form-slot">${url
    ?`<iframe src="${esc(url)}" title="Recevoir mes résultats par courriel" loading="lazy"></iframe>`
    :`<div class="placeholder">Le formulaire GHL s'affichera ici (prénom, courriel, consentement). Ajoute son lien dans <code>ghlFormUrl</code> au début du script.</div>`}</div>
  <div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-see>Voir mes résultats <span aria-hidden="true">→</span></button></div>`;
  root.querySelector("[data-see]").onclick=()=>{result();top();};
}
const lvl=v=>v>=80?["Bon","lv-bon","#1a1816"]:v>=55?["À améliorer","lv-moy","#c9a57c"]:["Priorité","lv-bas","#86603a"];
function result(){
  const R=compute(),r=P[R.p];
  const list=a=>`<ol>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  const msg=R.indice>=80?"Ta peau a de très bonnes bases. Quelques ajustements ciblés vont faire la différence.":R.indice>=60?"Ta peau a de bonnes bases, mais quelques habitudes freinent son plein potentiel.":"Plusieurs habitudes du quotidien pèsent sur ta peau en ce moment. La bonne nouvelle : ce sont des choses que tu peux changer.";
  root.innerHTML=`<div class="kick">Ton bilan peau</div>
  <div class="card"><div class="score"><div class="ring" style="--v:${R.indice}"><div>${R.indice}<small>sur 100</small></div></div>
    <div style="flex:1;min-width:200px"><h2 style="margin-bottom:6px">Ton indice peau</h2><p style="color:var(--muted);margin:0">${esc(msg)}</p></div></div>
    <div style="margin-top:14px">${Object.entries(PIL).map(([k,p])=>{const v=R.sc[k],L=lvl(v);return `<div class="pb"><div class="l"><span>${esc(p.n)}</span><em class="${L[1]}">${L[0]} · ${v}</em></div><div class="t"><i style="width:${Math.max(v,4)}%;background:${L[2]}"></i></div></div>`;}).join("")}</div>
  </div>
  <div class="card"><div class="kick">Ton profil de peau</div><h2>${esc(r.nom)}</h2><p style="color:var(--muted)">${esc(r.expl)}</p></div>
  <div class="card"><h3>Tes 3 priorités pour les 14 prochains jours</h3><p class="meta" style="margin-bottom:12px">Choisies selon tes réponses, de la plus importante à la moins importante.</p>
    ${R.pr.map((f,k)=>`<div class="prio"><div class="n">${k+1}</div><div><h4>${esc(f.t)}</h4><p>${esc(f.p)}</p><div class="g"><b>Ton geste :</b> ${esc(f.g)}</div></div></div>`).join("")}
    ${R.enceinte?`<div class="tip">${esc(ENCEINTE)}</div>`:""}
  </div>
  <div class="card"><h3>Ta routine simplifiée</h3>
    <div class="grid2"><div class="rt"><b>Matin</b>${list(r.matin)}</div><div class="rt"><b>Soir</b>${list(r.soir)}</div></div>
    <div class="actions" style="margin-top:16px"><button class="btn ghost" data-save>Enregistrer mon bilan</button></div>
    <p class="small" data-msg hidden></p>
  </div>
  <div class="card launch"><div class="kick">Le 16 novembre</div><h3>Le skinimalisme arrive en force</h3>
    <p style="margin:0">Moins de produits, mieux choisis : une routine courte et efficace, qui fait exactement ce que ton bilan recommande. Comme tu as fait ton bilan, tu seras parmi les premières au courant.</p></div>
  <p class="small">Ce bilan est un outil de sensibilisation. Il ne remplace pas l'avis d'une professionnelle de la santé ou d'une dermatologue.</p>
  <div class="actions"><button class="back" data-redo>↺ Refaire le bilan</button></div>`;
  root.querySelector("[data-redo]").onclick=()=>{intro();top();};
  root.querySelector("[data-save]").onclick=()=>saveCard(R,r);
  top();
}

/* ----- Carte « Mon bilan peau » en image (1080 x 1350) ----- */
function wrap(ctx,text,x,y,maxW,lh){
  const words=text.split(" ");let line="",yy=y;
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}else line=t;}
  if(line){ctx.fillText(line,x,yy);yy+=lh;}return yy;
}
function rr(x,X,Y,W,H,R){x.beginPath();x.roundRect?x.roundRect(X,Y,W,H,R):x.rect(X,Y,W,H);}
async function saveCard(R,r){
  const msg=root.querySelector("[data-msg]");const say=t=>{msg.hidden=false;msg.textContent=t;};
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  try{await document.fonts.ready;}catch(e){}
  x.fillStyle="#f5efe5";x.fillRect(0,0,W,H);
  x.fillStyle="#ffffff";x.strokeStyle="#e4dccf";x.lineWidth=3;rr(x,60,60,W-120,H-120,40);x.fill();x.stroke();
  x.fillStyle="#86603a";x.font="600 28px Inter, sans-serif";x.fillText("MON BILAN PEAU · "+CONFIG.marque.toUpperCase(),120,150);
  // indice
  x.lineWidth=22;x.strokeStyle="#e4dccf";x.beginPath();x.arc(215,300,85,0,Math.PI*2);x.stroke();
  x.strokeStyle="#1a1816";x.beginPath();x.arc(215,300,85,-Math.PI/2,-Math.PI/2+Math.PI*2*R.indice/100);x.stroke();
  x.fillStyle="#1a1816";x.textAlign="center";x.font="600 64px Fraunces, Georgia, serif";x.fillText(R.indice,215,318);
  x.font="400 22px Inter, sans-serif";x.fillStyle="#6b645b";x.fillText("sur 100",215,350);x.textAlign="left";
  x.fillStyle="#1a1816";x.font="600 50px Fraunces, Georgia, serif";x.fillStyle="#86603a";x.font="600 22px Inter, sans-serif";x.fillText("MON PROFIL DE PEAU",350,250);x.fillStyle="#1a1816";x.font="600 48px Fraunces, Georgia, serif";wrap(x,r.nom,350,310,610,58);
  // piliers
  let y=450;x.font="400 28px Inter, sans-serif";
  Object.entries(PIL).forEach(([k,p])=>{const v=R.sc[k],L=lvl(v);
    x.fillStyle="#1a1816";x.fillText(p.n,120,y);x.textAlign="right";x.fillStyle="#6b645b";x.fillText(v+"",960,y);x.textAlign="left";
    x.fillStyle="#e4dccf";rr(x,120,y+14,840,14,7);x.fill();x.fillStyle=L[2];rr(x,120,y+14,Math.max(840*v/100,14),14,7);x.fill();y+=74;});
  // priorités
  y+=30;x.fillStyle="#1a1816";x.font="600 34px Fraunces, Georgia, serif";x.fillText("Mes 3 priorités",120,y);y+=56;
  R.pr.forEach((f,k)=>{x.fillStyle="#1a1816";x.beginPath();x.arc(140,y-10,20,0,Math.PI*2);x.fill();
    x.fillStyle="#fff";x.font="600 22px Inter, sans-serif";x.textAlign="center";x.fillText(k+1,140,y-2);x.textAlign="left";
    x.fillStyle="#1a1816";x.font="400 30px Inter, sans-serif";y=wrap(x,f.t,180,y,780,40)+18;});
  // pied
  x.fillStyle="#86603a";x.fillRect(120,H-178,W-240,2);
  x.fillStyle="#1a1816";x.font="600 34px Fraunces, Georgia, serif";let fx=120;
  if(CONFIG.photo){try{const im=new Image();im.crossOrigin="anonymous";im.src=CONFIG.photo;await im.decode();
    x.save();x.beginPath();x.arc(165,H-110,45,0,Math.PI*2);x.clip();x.drawImage(im,120,H-155,90,90);x.restore();fx=235;}catch(e){}}
  x.fillText(CONFIG.nom,fx,H-115);x.fillStyle="#6b645b";x.font="400 26px Inter, sans-serif";x.fillText(CONFIG.marque,fx,H-75);
  c.toBlob(async b=>{
    if(!b){say("Impossible de créer l'image. Fais une capture d'écran de ton bilan.");return;}
    const f=new File([b],"mon-bilan-peau.png",{type:"image/png"});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Mon bilan peau"});say("C'est fait! Choisis « Enregistrer l'image » pour le garder dans tes photos.");return;}}catch(e){if(e&&e.name==="AbortError")return;}
    const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="mon-bilan-peau.png";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);say("Ton bilan est téléchargé.");
  },"image/png");
}
intro();
})();
</script>

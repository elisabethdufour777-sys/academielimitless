<!-- Décode ta peau · évaluation de la peau · Style de vie Lowtox
     À coller tel quel dans un élément « Code personnalisé » d'une page de funnel GHL.
     Tout est dans #lt-quiz : les styles ne touchent pas au reste de la page.
     Réglages : voir CONFIG au début du script. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<div id="lt-quiz" aria-live="polite"></div>
<style>
#lt-quiz{--bg:#f5efe5;--card:#ffffff;--ink:#1a1816;--muted:#6b645b;--sage:#a67c52;--sage-d:#1a1816;--sage-s:#efe7da;--line:#e4dccf;--rose:#a67c52;--rose-s:#f3e9dc;--gold:#a67c52;--bronze:#a67c52;--bronze-t:#86603a;
  font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);max-width:680px;margin:0 auto;padding:24px 16px 40px;border-radius:20px;box-sizing:border-box;line-height:1.55}
#lt-quiz *{box-sizing:border-box}
#lt-quiz h1,#lt-quiz h2,#lt-quiz h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.2;margin:0 0 12px;color:var(--ink)}
#lt-quiz h1{font-size:clamp(28px,6vw,38px)}
#lt-quiz h2{font-size:clamp(21px,5vw,27px)}
#lt-quiz h3{font-size:19px;margin-top:4px}
#lt-quiz p{margin:0 0 12px}
#lt-quiz .kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze-t);font-weight:600;margin-bottom:10px}
#lt-quiz .lead{color:var(--muted);font-size:17px}
#lt-quiz .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}
#lt-quiz .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--sage-d);color:#fff;font:600 16px Inter,sans-serif;padding:14px 26px;cursor:pointer;text-decoration:none;min-height:48px}
#lt-quiz .btn:hover{background:#3a3631}
#lt-quiz .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
#lt-quiz .btn.ghost:hover{background:var(--sage-s)}
#lt-quiz .meta{font-size:13px;color:var(--muted)}
#lt-quiz .sec{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:6px}
#lt-quiz .sec b{color:var(--bronze-t);font-weight:600}
#lt-quiz .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 22px}
#lt-quiz .bar i{display:block;height:100%;background:var(--bronze);border-radius:99px;transition:width .3s}
#lt-quiz .why{font-size:14px;color:var(--muted);margin:-4px 0 16px}
#lt-quiz .opts{display:flex;flex-direction:column;gap:10px}
#lt-quiz .opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font:500 16px Inter,sans-serif;color:var(--ink);cursor:pointer;min-height:52px;transition:border-color .15s,background .15s}
#lt-quiz .opt:hover,#lt-quiz .opt:focus-visible{border-color:var(--ink);background:var(--sage-s);outline:none}
#lt-quiz .opt.sel{border-color:var(--sage-d);background:var(--sage-s)}
#lt-quiz .back{background:none;border:0;color:var(--muted);font:500 14px Inter,sans-serif;cursor:pointer;padding:12px 0;margin-top:8px}
#lt-quiz .pillars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 6px}
@media(max-width:520px){#lt-quiz .pillars{grid-template-columns:1fr 1fr}}
#lt-quiz .pill{background:var(--sage-s);border-radius:12px;padding:12px 8px;font-size:13px;font-weight:500;color:var(--sage-d);text-align:center;display:grid;place-items:center}
#lt-quiz .score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
#lt-quiz .ring{--v:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--sage-d) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center;flex:0 0 auto}
#lt-quiz .ring div{width:94px;height:94px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-family:Fraunces,Georgia,serif;font-size:32px;font-weight:600;line-height:1}
#lt-quiz .ring small{display:block;font:500 12px Inter,sans-serif;color:var(--muted);margin-top:2px}
#lt-quiz .pb{margin:12px 0}
#lt-quiz .pb .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
#lt-quiz .pb .l em{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
#lt-quiz .pb .t{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
#lt-quiz .pb .t i{display:block;height:100%;border-radius:99px}
#lt-quiz .lv-bon{background:#ebe7e1;color:#1a1816}
#lt-quiz .lv-moy{background:#f3e9dc;color:#86603a}
#lt-quiz .lv-bas{background:#ead7c2;color:#6e4524}
#lt-quiz .prio{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
#lt-quiz .prio:first-of-type{border-top:0;padding-top:4px}
#lt-quiz .prio .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--sage-d);color:#fff;display:grid;place-items:center;font-weight:600}
#lt-quiz .prio h4{margin:2px 0 6px;font-size:16px}
#lt-quiz .prio p{font-size:15px;color:var(--muted);margin:0 0 6px}
#lt-quiz .prio .g{color:var(--ink);font-size:15px}
#lt-quiz .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){#lt-quiz .grid2{grid-template-columns:1fr}}
#lt-quiz .rt{background:var(--sage-s);border-radius:12px;padding:14px}
#lt-quiz .rt b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--bronze-t);margin-bottom:6px}
#lt-quiz ol,#lt-quiz ul{margin:0;padding-left:20px}
#lt-quiz li{margin-bottom:6px}
#lt-quiz .tip{border-left:3px solid var(--bronze);padding:10px 14px;background:var(--rose-s);border-radius:0 10px 10px 0;margin-top:12px;font-size:15px}
#lt-quiz .launch{border-color:var(--bronze);background:var(--bg)}
#lt-quiz .launch .kick{margin-bottom:6px}
#lt-quiz .form-slot{margin-top:16px;border-radius:12px;overflow:hidden;background:#fff}
#lt-quiz .form-slot iframe{width:100%;border:0;min-height:520px;display:block}
#lt-quiz .placeholder{padding:18px;color:var(--muted);font-size:14px;border:1.5px dashed var(--bronze);border-radius:12px;background:transparent}
#lt-quiz .fld{display:block;margin:0 0 14px}
#lt-quiz .fld span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
#lt-quiz .fld input{width:100%;font:400 16px Inter,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:50px}
#lt-quiz .fld input:focus{outline:none;border-color:var(--ink)}
#lt-quiz .consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin:4px 0 16px;cursor:pointer}
#lt-quiz .consent input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:0 0 auto}
#lt-quiz .err{color:#9a3b2a;font-size:14px;margin:0 0 12px}
#lt-quiz .btn[disabled]{opacity:.6;cursor:wait}
#lt-quiz .hero{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;object-position:30% 50%;border-radius:14px;margin:0 0 20px}
#lt-quiz .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
#lt-quiz .small{font-size:12px;color:var(--muted);margin-top:14px}
</style>

let i=0,ans=[],prenomP="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const top=()=>{const r=root.getBoundingClientRect();if(r.top<0)window.scrollTo({top:window.scrollY+r.top-16,behavior:"smooth"});};

function ask(){
  const it=Q[i];
  root.innerHTML=`<div class="sec"><span><b>${it.s+1}/${SEC.length}</b> · ${esc(SEC[it.s])}</span><span>${i+1} sur ${Q.length}</span></div>
  <div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div>
  <h2>${esc(it.q)}</h2>${it.w?`<p class="why">${esc(it.w)}</p>`:""}
  <div class="opts">${it.o.map((o,k)=>`<button class="opt ${ans[i]===k?"sel":""}" data-k="${k}">${esc(o[0])}</button>`).join("")}</div>
  ${i?'<button class="back" data-back>← Question précédente</button>':""}`;
  root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;i++;i<Q.length?ask():courriel();top();});
  const bk=root.querySelector("[data-back]");if(bk)bk.onclick=()=>{i--;ask();};
}
function compute(){
  const prof={A:0,F:0,E:0,R:0},lost={h:0,b:0,v:0,p:0,r:0},max={h:0,b:0,v:0,p:0,r:0},flags=new Set();
  Q.forEach((q,qi)=>{
    Object.keys(max).forEach(k=>{max[k]+=Math.max(...q.o.map(o=>(o[2]||{})[k]||0));});
    const o=q.o[ans[qi]];
    Object.entries(o[1]).forEach(([k,v])=>prof[k]+=v);
    Object.entries(o[2]).forEach(([k,v])=>lost[k]+=v);
    if(o[3])flags.add(o[3]);
  });
  const sc={};Object.keys(max).forEach(k=>sc[k]=max[k]?Math.round(100*(1-lost[k]/max[k])):100);
  const indice=Math.round(Object.values(sc).reduce((a,b)=>a+b,0)/5);
  const m=Math.max(...Object.values(prof));const p=m?ORDER.find(k=>prof[k]===m):"E";
  const enceinte=flags.delete("enceinte");
  let pr=[...flags].filter(f=>PR[f]).sort((a,b)=>PR[b].w-PR[a].w).map(f=>PR[f]);
  for(const e of ENTRETIEN[p]){if(pr.length>=3)break;pr.push(e);}
  if(pr.length<3)pr.push({t:"Garder le cap",p:"Tes habitudes sont déjà excellentes : ta peau te remercie.",g:"Continue exactement ce que tu fais, et refais cette évaluation dans 3 mois ou au changement de saison."});
  return {p,sc,indice,pr:pr.slice(0,3),enceinte};
}
/* Page intermédiaire : prénom et courriel obligatoires avant les résultats */
function courriel(){
  root.innerHTML=`<div class="kick">Tes résultats sont prêts</div>
  <h1>Où veux-tu recevoir tes résultats?</h1>
  <p class="lead">Inscris ton prénom et ton courriel pour voir tes résultats. Je te les envoie aussi par courriel, pour que tu puisses les garder et y revenir.</p>
  <form class="card" data-form novalidate>
    <label class="fld"><span>Prénom</span><input name="prenom" autocomplete="given-name" required></label>
    <label class="fld"><span>Courriel</span><input name="courriel" type="email" autocomplete="email" inputmode="email" required></label>
    <label class="consent"><input type="checkbox" name="consentement" required><span>J'accepte de recevoir mes résultats et des nouvelles de ${esc(CONFIG.marque)} par courriel. Je peux me désabonner en tout temps.</span></label>
    <p class="err" data-err hidden></p>
    <button class="btn" type="submit" style="width:100%">Voir mes résultats <span aria-hidden="true">→</span></button>
    ${CONFIG.ghlWebhookUrl?"":'<p class="small">Mode test : le webhook GHL n\'est pas encore branché, rien n\'est envoyé.</p>'}
  </form>`;
  const f=root.querySelector("[data-form]"),err=root.querySelector("[data-err]");
  f.onsubmit=async e=>{
    e.preventDefault();
    const prenom=f.prenom.value.trim(),mail=f.courriel.value.trim();
    const bad=!prenom?"Inscris ton prénom.":!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)?"Vérifie ton adresse courriel.":!f.consentement.checked?"Coche la case pour recevoir tes résultats par courriel.":"";
    if(bad){err.hidden=false;err.textContent=bad;return;}
    err.hidden=true;const btn=f.querySelector("button");btn.disabled=true;
    prenomP=prenom;await envoyer(prenom,mail);
    result();top();
  };
}
/* Envoi au webhook GHL. On n'empêche jamais la personne de voir ses résultats si le réseau flanche. */
async function envoyer(prenom,mail){
  if(!CONFIG.ghlWebhookUrl)return;
  const R=compute(),r=P[R.p];
  const data={prenom:prenom,first_name:prenom,courriel:mail,email:mail,consentement:"oui",source:CONFIG.source,
    profil_de_peau:r.court,score_equilibre:R.indice,priorites_peau:R.pr.map((f,k)=>(k+1)+". "+f.t).join("\n"),
    score_hydratation:R.sc.h,score_barriere:R.sc.b,score_mode_de_vie:R.sc.v,score_protection:R.sc.p,score_routine:R.sc.r,
    profil_explication:r.expl};
  R.pr.forEach((f,k)=>{data["priorite_"+(k+1)]=f.t;data["priorite_"+(k+1)+"_geste"]=f.g;});
  const t=new Promise(res=>setTimeout(res,5000));
  const go=(async()=>{
    try{const x=await fetch(CONFIG.ghlWebhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});if(x.ok)return;}catch(e){}
    try{await fetch(CONFIG.ghlWebhookUrl,{method:"POST",mode:"no-cors",body:new URLSearchParams(Object.entries(data).map(([k,v])=>[k,String(v)]))});}catch(e){}
  })();
  await Promise.race([go,t]);
}

function pdf(R,r){

/* ----- Carte « Mon bilan peau » en image (1080 x 1350) ----- */
function wrap(ctx,text,x,y,maxW,lh){
  const words=text.split(" ");let line="",yy=y;
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}else line=t;}
  if(line){ctx.fillText(line,x,yy);yy+=lh;}return yy;
}
function rr(x,X,Y,W,H,R){x.beginPath();x.roundRect?x.roundRect(X,Y,W,H,R):x.rect(X,Y,W,H);}
async function saveCard(R,r){
  const msg=root.querySelector("[data-msg]");const say=t=>{msg.hidden=false;msg.textContent=t;};
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  try{await document.fonts.ready;}catch(e){}
  x.fillStyle="#f5efe5";x.fillRect(0,0,W,H);
  x.fillStyle="#ffffff";x.strokeStyle="#e4dccf";x.lineWidth=3;rr(x,60,60,W-120,H-120,40);x.fill();x.stroke();
  x.fillStyle="#86603a";x.font="600 28px Inter, sans-serif";x.fillText("DÉCODE TA PEAU · "+CONFIG.marque.toUpperCase(),120,150);
  // indice
  x.lineWidth=22;x.strokeStyle="#e4dccf";x.beginPath();x.arc(215,300,85,0,Math.PI*2);x.stroke();
  x.strokeStyle="#1a1816";x.beginPath();x.arc(215,300,85,-Math.PI/2,-Math.PI/2+Math.PI*2*R.indice/100);x.stroke();
  x.fillStyle="#1a1816";x.textAlign="center";x.font="600 64px Fraunces, Georgia, serif";x.fillText(R.indice,215,318);
  x.font="400 22px Inter, sans-serif";x.fillStyle="#6b645b";x.fillText("sur 100",215,350);x.textAlign="left";
  x.fillStyle="#1a1816";x.font="600 50px Fraunces, Georgia, serif";x.fillStyle="#86603a";x.font="600 22px Inter, sans-serif";x.fillText("MON PROFIL DE PEAU",350,250);x.fillStyle="#1a1816";x.font="600 48px Fraunces, Georgia, serif";wrap(x,r.nom,350,310,610,58);
  // piliers
  let y=450;x.font="400 28px Inter, sans-serif";
  Object.entries(PIL).forEach(([k,p])=>{const v=R.sc[k],L=lvl(v);
    x.fillStyle="#1a1816";x.fillText(p.n,120,y);x.textAlign="right";x.fillStyle="#6b645b";x.fillText(v+"",960,y);x.textAlign="left";
    x.fillStyle="#e4dccf";rr(x,120,y+14,840,14,7);x.fill();x.fillStyle=L[2];rr(x,120,y+14,Math.max(840*v/100,14),14,7);x.fill();y+=74;});
  // priorités
  y+=30;x.fillStyle="#1a1816";x.font="600 34px Fraunces, Georgia, serif";x.fillText("Mes 3 priorités",120,y);y+=56;
  R.pr.forEach((f,k)=>{x.fillStyle="#1a1816";x.beginPath();x.arc(140,y-10,20,0,Math.PI*2);x.fill();
    x.fillStyle="#fff";x.font="600 22px Inter, sans-serif";x.textAlign="center";x.fillText(k+1,140,y-2);x.textAlign="left";
    x.fillStyle="#1a1816";x.font="400 30px Inter, sans-serif";y=wrap(x,f.t,180,y,780,40)+18;});
  // pied
  x.fillStyle="#86603a";x.fillRect(120,H-178,W-240,2);
  x.fillStyle="#1a1816";x.font="600 34px Fraunces, Georgia, serif";let fx=120;
  if(CONFIG.photo){try{const im=new Image();im.crossOrigin="anonymous";im.src=CONFIG.photo;await im.decode();
    x.save();x.beginPath();x.arc(165,H-110,45,0,Math.PI*2);x.clip();x.drawImage(im,120,H-155,90,90);x.restore();fx=235;}catch(e){}}
  x.fillText(CONFIG.nom,fx,H-115);x.fillStyle="#6b645b";x.font="400 26px Inter, sans-serif";x.fillText(CONFIG.marque,fx,H-75);
  c.toBlob(async b=>{
    if(!b){say("Impossible de créer l'image. Fais une capture d'écran de tes résultats.");return;}
    const f=new File([b],"decode-ta-peau.png",{type:"image/png"});

    const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="decode-ta-peau.png";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);say("Tes résultats sont téléchargés.");
  },"image/png");
}

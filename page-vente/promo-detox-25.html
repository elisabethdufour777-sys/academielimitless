<!-- Page de vente · Promo 25 % · Routine détox · Style de vie Lowtox
     À coller tel quel dans un élément « Code personnalisé » d'une page GHL (section pleine largeur, sans marges).
     Tout est dans #lt-promo : les styles ne touchent pas au reste de la page.
     Réglages : voir CONFIG au début du script (vidéo, liens d'achat, prix, date de fin, photos). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<div id="lt-promo"></div>
<style>
#lt-promo{--bg:#f5efe5;--card:#fff;--ink:#1a1816;--muted:#6b645b;--line:#e4dccf;--soft:#efe7da;--bronze:#a67c52;--bronze-t:#86603a;--gold:#c9a57c;--sage:#7d8a6a;
  font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;box-sizing:border-box;overflow:hidden}
#lt-promo *{box-sizing:border-box}
#lt-promo .w{max-width:1180px;margin:0 auto;padding:0 32px}
#lt-promo section{padding:72px 0}
#lt-promo h1,#lt-promo h2,#lt-promo h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.12;margin:0 0 14px;color:var(--ink)}
#lt-promo h1{font-size:clamp(38px,5.6vw,72px);letter-spacing:-.01em}
#lt-promo h2{font-size:clamp(28px,3.6vw,42px)}
#lt-promo h3{font-size:22px}
#lt-promo p{margin:0 0 14px}
#lt-promo .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze-t);font-weight:600;margin-bottom:14px}
#lt-promo .lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:640px}
#lt-promo .c{text-align:center}#lt-promo .c .lead{margin-left:auto;margin-right:auto}
#lt-promo .small{font-size:13px;color:var(--muted)}
#lt-promo .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:600 16px Inter,sans-serif;padding:17px 34px;text-decoration:none;min-height:54px;cursor:pointer;transition:background .2s,transform .2s}
#lt-promo .btn:hover{background:#3a3631}
#lt-promo .btn.light{background:#f5efe5;color:var(--ink)}#lt-promo .btn.light:hover{background:#fff}
#lt-promo .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}#lt-promo .btn.ghost:hover{background:var(--soft)}
#lt-promo .btn.sm{font-size:15px;padding:13px 22px;min-height:48px;width:100%}
/* bandeau promo */
#lt-promo .top{background:var(--bronze);color:#fff;text-align:center;font-size:14px;font-weight:600;letter-spacing:.04em;padding:11px 16px}
/* hero */
#lt-promo .hero{background:radial-gradient(120% 90% at 80% 30%,#3a332b 0%,#1a1816 60%,#121110 100%);color:#f5efe5;padding:64px 0 72px}
#lt-promo .hero .k{color:var(--gold)}
#lt-promo .hero h1{color:#fff;max-width:900px;margin-left:auto;margin-right:auto}
#lt-promo .hero h1 em{font-style:italic;font-weight:500;color:var(--gold)}
#lt-promo .hero .lead{color:#cfc6ba}
#lt-promo .badge{display:inline-flex;align-items:baseline;gap:10px;border:1px solid rgba(201,165,124,.45);border-radius:999px;padding:8px 20px;margin-bottom:22px;color:#f5efe5;font-size:14px}
#lt-promo .badge b{font-family:Fraunces,Georgia,serif;font-size:24px;color:var(--gold);line-height:1}
/* vidéo */
#lt-promo .vid{position:relative;max-width:900px;margin:36px auto 0;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#0d0c0b;box-shadow:0 30px 70px rgba(0,0,0,.45);border:1px solid rgba(201,165,124,.25)}
#lt-promo .vid.v916{aspect-ratio:9/16;max-width:400px}
#lt-promo .vid iframe,#lt-promo .vid video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;object-fit:cover}
#lt-promo .vid .ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;color:#cfc6ba;font-size:15px;text-align:center;padding:24px}
#lt-promo .vid .play{width:84px;height:84px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin:0 auto}
#lt-promo .vid .play:after{content:"";border-left:24px solid var(--ink);border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:6px}
#lt-promo .hero .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
/* déblocage */
#lt-promo .lock{max-width:560px;margin:30px auto 0;border:1px solid rgba(201,165,124,.35);border-radius:18px;padding:20px 24px;text-align:center}
#lt-promo .lock p{color:#cfc6ba;font-size:15px;margin:0 0 12px}
#lt-promo .lock p b{color:#fff}
#lt-promo .bar{height:6px;border-radius:99px;background:rgba(245,239,229,.14);overflow:hidden}
#lt-promo .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .6s ease}
#lt-promo .gate[hidden],#lt-promo .acts[hidden],#lt-promo .lock[hidden]{display:none}
#lt-promo .gate.open,#lt-promo .acts.open{animation:ltOpen .9s cubic-bezier(.2,.7,.2,1)}
@keyframes ltOpen{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#lt-promo .gate.open,#lt-promo .acts.open{animation:none}}
/* décompte */
#lt-promo .cd{margin-top:30px}
#lt-promo .cd-t{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--bronze-t);margin-bottom:10px}
#lt-promo .cd-g{display:flex;justify-content:center}
#lt-promo .cd-g div{text-align:center;padding:0 22px;min-width:92px}#lt-promo .cd-g div+div{border-left:1px solid var(--line)}
#lt-promo .cd-g b{display:block;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:6px}
#lt-promo .cd-g span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#lt-promo .cd.dark .cd-t{color:var(--gold)}#lt-promo .cd.dark .cd-g div+div{border-color:rgba(255,255,255,.22)}
#lt-promo .cd.dark .cd-g b{color:#fff}#lt-promo .cd.dark .cd-g span{color:#cfc6ba}
#lt-promo .over{font-weight:600;color:var(--bronze-t)}
/* piliers */
#lt-promo .band{background:var(--ink);color:#f5efe5;padding:56px 0}
#lt-promo .band h2{color:#fff;max-width:780px;margin:0 auto 10px}
#lt-promo .band p{color:#cfc6ba;max-width:660px;margin:0 auto}
#lt-promo .pil{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:34px}
#lt-promo .pil div{border:1px solid rgba(245,239,229,.16);border-radius:14px;padding:18px 14px;text-align:center}
#lt-promo .pil b{display:block;font-family:Fraunces,Georgia,serif;font-size:19px;color:#fff;margin-bottom:4px}
#lt-promo .pil span{font-size:13px;color:#cfc6ba;line-height:1.45;display:block}
/* produits */
#lt-promo .prods{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;margin-top:40px}
#lt-promo .pr{grid-column:span 2;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
#lt-promo .pr:nth-child(4){grid-column:2/span 2}
#lt-promo .pr .pic{position:relative;aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;overflow:hidden}
#lt-promo .pr .pic img{width:100%;height:100%;object-fit:contain;display:block;padding:18px}
#lt-promo .pr .pic .mono{font-family:Fraunces,Georgia,serif;font-size:56px;color:var(--bronze);opacity:.55}
#lt-promo .pr .off{position:absolute;top:14px;left:14px;background:var(--bronze);color:#fff;font-size:13px;font-weight:600;border-radius:99px;padding:5px 12px}
#lt-promo .pr .bd{padding:24px;display:flex;flex-direction:column;flex:1}
#lt-promo .pr .role{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);font-weight:600;margin-bottom:4px}
#lt-promo .pr h3{margin-bottom:8px}
#lt-promo .pr .d{color:var(--muted);font-size:15px}
#lt-promo .pr ul{list-style:none;padding:0;margin:4px 0 16px;border-top:1px solid var(--line);flex:1}
#lt-promo .pr li{padding:9px 0 9px 20px;border-bottom:1px solid var(--line);font-size:14px;position:relative}
#lt-promo .pr li:before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--bronze)}
#lt-promo .pr .note{font-size:13px;color:var(--bronze-t);margin:-6px 0 14px}
#lt-promo .price{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
#lt-promo .price s{color:var(--muted);font-size:15px}
#lt-promo .price b{font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1}
#lt-promo .price span{font-size:13px;color:var(--bronze-t);font-weight:600}
/* routine */
#lt-promo .day{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px;position:relative}
#lt-promo .day>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
#lt-promo .day .t{font-family:Fraunces,Georgia,serif;font-size:26px;color:var(--bronze);line-height:1;margin-bottom:6px}
#lt-promo .day h3{font-size:18px;margin-bottom:6px}
#lt-promo .day p{color:var(--muted);font-size:14.5px;margin:0}
/* ensemble */
#lt-promo .pack{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:0;background:var(--ink);color:#f5efe5;border-radius:24px;overflow:hidden;margin-top:8px}
#lt-promo .pack .l{padding:48px}
#lt-promo .pack h2{color:#fff}#lt-promo .pack .k{color:var(--gold)}#lt-promo .pack p{color:#cfc6ba}
#lt-promo .pack ul{list-style:none;padding:0;margin:20px 0 0}
#lt-promo .pack li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.12);font-size:15px}
#lt-promo .pack li span{color:#cfc6ba}
#lt-promo .pack .r{background:#24211d;padding:48px;display:flex;flex-direction:column;justify-content:center;text-align:center}
#lt-promo .pack .r s{color:#a39a8e;font-size:18px}
#lt-promo .pack .r .big{font-family:Fraunces,Georgia,serif;font-size:58px;color:#fff;line-height:1;margin:6px 0}
#lt-promo .pack .r .eco{display:inline-block;background:rgba(201,165,124,.16);color:var(--gold);border-radius:99px;padding:6px 16px;font-size:14px;font-weight:600;margin:6px auto 22px}
/* lowtox */
#lt-promo .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
#lt-promo .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
#lt-promo .box ul{list-style:none;padding:0;margin:12px 0 0}
#lt-promo .box li{padding:9px 0 9px 22px;border-top:1px solid var(--line);position:relative;font-size:15px}
#lt-promo .box li:before{content:"";position:absolute;left:2px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--sage)}
#lt-promo .story{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;margin-top:20px}
#lt-promo .story .q{font-family:Fraunces,Georgia,serif;font-size:72px;line-height:.8;color:var(--bronze)}
#lt-promo .story p{font-size:17px;margin:0 0 12px}
#lt-promo .story .sig{font-size:14px;color:var(--muted);margin:0}
/* témoignages */
#lt-promo .tes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
#lt-promo .te{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
#lt-promo .te p{font-style:italic;color:var(--muted);font-size:15.5px}
#lt-promo .te b{font-size:14px}
/* faq */
#lt-promo .faq{max-width:820px;margin:36px auto 0}
#lt-promo details{border-bottom:1px solid var(--line);padding:18px 0}
#lt-promo summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
#lt-promo summary::-webkit-details-marker{display:none}
#lt-promo summary:after{content:"+";font-weight:400;font-size:22px;color:var(--bronze);line-height:1}
#lt-promo details[open] summary:after{content:"–"}
#lt-promo details p{margin:12px 0 0;color:var(--muted)}
#lt-promo .final{background:var(--ink);color:#fff;border-radius:24px;padding:56px 40px}
#lt-promo .final h2{color:#fff}#lt-promo .final p{color:#cfc6ba}
#lt-promo .legal{font-size:12px;color:var(--muted);text-align:center;max-width:780px;margin:28px auto 0}
@media(max-width:980px){
  #lt-promo .prods{grid-template-columns:1fr 1fr}
  #lt-promo .pr,#lt-promo .pr:nth-child(4){grid-column:auto}
  #lt-promo .pr:nth-child(5){grid-column:1/-1;max-width:520px;justify-self:center;width:100%}
  #lt-promo .pil{grid-template-columns:repeat(3,1fr)}
  #lt-promo .day{grid-template-columns:1fr 1fr}
}
@media(max-width:700px){
  #lt-promo section{padding:52px 0}
  #lt-promo .w{padding:0 18px}
  #lt-promo .hero{padding:44px 0 52px}
  #lt-promo .prods,#lt-promo .two,#lt-promo .tes,#lt-promo .day,#lt-promo .pack{grid-template-columns:1fr}
  #lt-promo .pr:nth-child(5){max-width:none}
  #lt-promo .pil{grid-template-columns:1fr 1fr}
  #lt-promo .pil div:last-child{grid-column:1/-1}
  #lt-promo .pack .l,#lt-promo .pack .r{padding:32px 24px}
  #lt-promo .story{grid-template-columns:1fr;gap:6px;padding:26px}
  #lt-promo .final{padding:40px 22px}
  #lt-promo .cd-g div{min-width:0;flex:1;padding:0 6px}#lt-promo .cd-g b{font-size:34px}#lt-promo .cd-g span{font-size:10px;letter-spacing:.06em}
  #lt-promo .hero .acts .btn{width:100%}
}
</style>
<script>
(function(){
/* ================= CONFIG ================= */
const CONFIG={
  nom:"Eli Dufour",
  rabais:25,                                   // % de rabais
  /* Date et heure de FIN de la promo (heure de l'Est : -05:00). Le décompte s'arrête et le texte change tout seul. */
  fin:"2026-11-30T23:59:00-05:00",
  /* VIDÉO : lien YouTube, Vimeo ou fichier .mp4 (ex. téléversé dans la médiathèque GHL). Vide = image « vidéo à venir ». */
  video:"",
  videoVertical:false,                         // true si la vidéo est filmée à la verticale (9:16)
  /* DÉBLOCAGE : les produits et les prix apparaissent quand la personne a vu ce % de la vidéo. 0 = tout afficher tout de suite.
     Une fois débloquée, la page reste débloquée pour cette personne (même appareil).
     Pour un lien qui ouvre la page déjà débloquée (ex. courriel « dernière chance ») : ajoute ?acces=1 à la fin du lien. */
  seuil:40,
  /* Lien d'achat général (ta boutique Partner.Co). Chaque produit peut avoir son propre lien plus bas. */
  lien:"https://partner.co/",
  /* Lien de l'ensemble complet (panier avec les 5 produits). Vide = lien général. */
  lienEnsemble:"",
  /* PRODUITS : prix régulier (ex. "89,95 $"), lien d'achat et photo (téléversée dans la médiathèque GHL).
     Le prix réduit se calcule tout seul. Prix vide = on affiche seulement « -25 % ». */
  produits:{
    restoriix:  {prix:"", lien:"", img:""},
    rejuveniix: {prix:"", lien:"", img:""},
    renew:      {prix:"", lien:"", img:""},
    sugarstop:  {prix:"", lien:"", img:""},
    beautyboost:{prix:"", lien:"", img:""}
  },
  /* TÉMOIGNAGES (optionnel) : {texte:"…", nom:"Julie", produit:"Restoriix"} */
  temoignages:[
  ]
};
/* ========================================== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const n=parseFloat(String(s).replace(/[^\d,.]/g,"").replace(/\s/g,"").replace(",","."));return isNaN(n)?0:n};
const fmt=n=>n.toFixed(2).replace(".",",")+" $";
const R=CONFIG.rabais/100;
const FIN=CONFIG.fin?new Date(CONFIG.fin).getTime():0;
const jourFin=FIN?new Date(FIN).toLocaleDateString("fr-CA",{day:"numeric",month:"long",timeZone:"America/Toronto"}):"";
const ln=u=>esc(u||CONFIG.lien||"#");
const cta=(t,u,cls)=>`<a class="btn ${cls||""}" href="${ln(u)}" target="_blank" rel="noopener">${t} <span aria-hidden="true">→</span></a>`;
const cd=cls=>FIN?`<div class="cd ${cls||""}" data-cd><div class="cd-t">La promo se termine le ${esc(jourFin)} à minuit</div><div class="cd-g">${[["j","jours"],["h","heures"],["m","minutes"],["s","secondes"]].map(u=>`<div><b data-u="${u[0]}">00</b><span>${u[1]}</span></div>`).join("")}</div></div>`:"";

const P=[
 {id:"restoriix",n:"Restoriix",m:"R",role:"Le cœur de la détox",
  d:"Un complément de purification qui soutient les processus naturels de détoxification du corps.",
  i:["Zéolite et charbon activé","Chlorelle et spiruline","Superaliments verts"],
  note:"À prendre à distance des médicaments et des autres suppléments, selon l'étiquette."},
 {id:"renew",n:"Renew",m:"Rn",role:"Nourrir les cellules",
  d:"Une formule brevetée de vitamines, minéraux et plantes, pensée pour bien vieillir.",
  i:["Vitamines et minéraux","Extraits de plantes","Pour le vieillissement en santé"]},
 {id:"rejuveniix",n:"Rejuveniix",m:"Rj",role:"Antioxydants et énergie",
  d:"En capsules : de l'énergie et de la concentration, avec des fruits riches en antioxydants.",
  i:["Açaï, bleuets et goji","Caféine naturelle du café vert","Pratique à la place du café de l'après-midi"],
  note:"Contient de la caféine."},
 {id:"sugarstop",n:"CoLab Sugar Stop",m:"S",role:"Calmer le sucre",
  d:"Des fibres, du haricot blanc et du L-arabinose pour réduire l'absorption des sucres. Saveur mangue.",
  i:["Fibres","Extrait de haricot blanc","L-arabinose"]},
 {id:"beautyboost",n:"Optimals Beauty Boost",m:"B",role:"Hydrater de l'intérieur",
  d:"Une hydratation beauté avec plus de 3 000 mg d'électrolytes. Saveur mandarine-papaye, végane.",
  i:["Plus de 3 000 mg d'électrolytes","Biotine et algues rouges","Enzymes"]}
];
const PIL=[["Purifier","Restoriix"],["Nourrir","Renew"],["Protéger","Rejuveniix"],["Équilibrer","Sugar Stop"],["Hydrater","Beauty Boost"]];
const DAY=[["Matin","Hydrater","Beauty Boost dans ta bouteille d'eau, pour bien partir la journée."],["Au repas","Nourrir","Renew, selon l'étiquette, avec un de tes repas."],["Avant un repas","Équilibrer","Sugar Stop avant un repas plus riche en féculents."],["En après-midi","Recharger","Rejuveniix au lieu du café de 14 h."]];
const FAQ=[
 ["Combien de temps dure la promo?",FIN?`Jusqu'au ${jourFin} à minuit (heure de l'Est), ou jusqu'à épuisement des stocks. Après, les produits reviennent au prix régulier.`:"Pour une durée limitée seulement. Après, les produits reviennent au prix régulier."],
 ["Est-ce que je dois prendre les 5 produits?","Non. Chaque produit s'achète seul. Restoriix est le cœur de la routine détox, et les autres viennent soutenir l'hydratation, la nutrition et l'équilibre. Si tu hésites, écris-moi et on regarde ensemble ce qui te convient."],
 ["Comment je prends Restoriix?","Selon les indications de l'étiquette, à distance de tes médicaments et de tes autres suppléments. Bois beaucoup d'eau : c'est là que Beauty Boost devient ton meilleur allié."],
 ["Rejuveniix contient de la caféine?","Oui, de la caféine naturelle de café vert. Évite-le en fin de journée si tu y es sensible, et tiens compte de ton café."],
 ["Est-ce que ça remplace une alimentation saine?","Non. Ces produits accompagnent une démarche globale : bien manger, bouger, bien dormir, et réduire tes expositions aux toxines du quotidien (plastiques, produits ménagers, cosmétiques)."],
 ["Je prends des médicaments, je suis enceinte ou j'allaite.","Vérifie avec ta professionnelle de la santé avant de commencer un nouveau supplément."]
];
const root=document.getElementById("lt-promo");
const pr=P.map(p=>{const c=CONFIG.produits[p.id]||{};const reg=num(c.prix);return{...p,lien:c.lien||CONFIG.lien,img:c.img,reg,promo:reg?reg*(1-R):0}});
const totReg=pr.reduce((a,p)=>a+p.reg,0),allPrix=pr.every(p=>p.reg);
const vid=(()=>{const u=CONFIG.video.trim();if(!u)return`<div class="ph"><div class="play"></div>La vidéo s'affiche ici</div>`;
  let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);if(m)return`<iframe data-yt src="https://www.youtube.com/embed/${m[1]}?rel=0&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" title="Vidéo : la routine détox" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`;

/* déblocage selon la vidéo */
if(GATED){
  const gate=root.querySelector("[data-gate]"),acts=root.querySelector("[data-acts]"),lock=root.querySelector("[data-lock]"),bar=lock.querySelector(".bar"),fill=bar.querySelector("i");
  let ouvert=false,max=0;
  const ouvrir=()=>{if(ouvert)return;ouvert=true;try{localStorage.setItem(KEY,"1")}catch(e){}
    fill.style.width="100%";setTimeout(()=>{lock.hidden=true;acts.hidden=false;acts.classList.add("open");gate.hidden=false;gate.classList.add("open")},500)};
  const prog=pct=>{if(ouvert||!isFinite(pct))return;max=Math.max(max,pct);const v=Math.min(100,max/CONFIG.seuil*100);fill.style.width=v+"%";bar.setAttribute("aria-valuenow",Math.round(v));if(max>=CONFIG.seuil)ouvrir()};
  const v=root.querySelector(".vid video"),yt=root.querySelector("iframe[data-yt]"),vm=root.querySelector("iframe[data-vimeo]");
  const charger=(src,ok)=>{const s=document.createElement("script");s.src=src;if(ok)s.onload=ok;s.onerror=ouvrir;document.head.appendChild(s)};
  if(v){v.addEventListener("timeupdate",()=>v.duration&&prog(v.currentTime/v.duration*100));v.addEventListener("error",ouvrir)}
  else if(yt){
    const go=()=>{const pl=new YT.Player(yt,{events:{onReady:()=>setInterval(()=>{try{const d=pl.getDuration();if(d)prog(pl.getCurrentTime()/d*100)}catch(e){}},1000)}})};
    if(window.YT&&window.YT.Player)go();else{const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{prev&&prev();go()};charger("https://www.youtube.com/iframe_api")}}
  else if(vm){const go=()=>new Vimeo.Player(vm).on("timeupdate",d=>prog(d.percent*100));if(window.Vimeo&&window.Vimeo.Player)go();else charger("https://player.vimeo.com/api/player.js",go)}
  else ouvrir();
}

/* décompte */

    const v={j:Math.floor(r/864e5),h:Math.floor(r/36e5)%24,m:Math.floor(r/6e4)%60,s:Math.floor(r/1e3)%60};
    cds.forEach(c=>c.querySelectorAll("b[data-u]").forEach(b=>b.textContent=pad(v[b.dataset.u])))};
  const t=setInterval(tick,1000);tick();}

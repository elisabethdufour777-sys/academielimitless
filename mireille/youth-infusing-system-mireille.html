<!-- Page de vente · Co.Lab Youth Infusing System · Mireille Chevalier, naturothérapeute agréée
     À coller tel quel dans un élément « Code personnalisé » d'une page GHL (section pleine largeur, sans marges).
     Tout est dans #lt-vente : les styles ne touchent pas au reste de la page.
     Réglages : voir CONFIG au début du script (lien d'achat, prix, transformations). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<div id="lt-vente"></div>
<style>
#lt-vente{--bg:#f8f9fa;--card:#fff;--ink:#1f3b45;--muted:#5d6b71;--line:#dfe8eb;--soft:#e8f3f6;--bronze:#ff585d;--bronze-t:#007396;
  font-family:Poppins,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;box-sizing:border-box;overflow:hidden}
#lt-vente *{box-sizing:border-box}
#lt-vente .w{max-width:1320px;margin:0 auto;padding:0 32px}
#lt-vente section{padding:72px 0}
#lt-vente h1,#lt-vente h2,#lt-vente h3{font-family:Poppins,Arial,sans-serif;font-weight:600;line-height:1.15;margin:0 0 14px;color:var(--ink)}
#lt-vente h1{font-size:clamp(38px,5.4vw,66px);letter-spacing:-.01em}
#lt-vente h2{font-size:clamp(28px,3.6vw,42px)}
#lt-vente h3{font-size:21px}
#lt-vente p{margin:0 0 14px}
#lt-vente .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze-t);font-weight:600;margin-bottom:14px}
#lt-vente .lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:620px}
#lt-vente .c{text-align:center}#lt-vente .c .lead{margin-left:auto;margin-right:auto}
#lt-vente .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:600 16px Poppins,sans-serif;padding:17px 34px;text-decoration:none;min-height:54px;cursor:pointer;transition:background .2s}
#lt-vente .btn:hover{background:#e5484d}
#lt-vente .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
#lt-vente .btn.ghost:hover{background:var(--soft)}
#lt-vente .small{font-size:13px;color:var(--muted)}
/* hero */
#lt-vente .hero{position:relative;background:radial-gradient(120% 90% at 75% 45%,#0d6a84 0%,#1f3b45 58%,#06303d 100%);color:#f8f9fa;padding:0;overflow:hidden;min-height:min(92vh,880px);display:flex;flex-direction:column}
#lt-vente .hero .w{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center;padding-top:56px;padding-bottom:40px}
#lt-vente .hero h1{color:#fff;font-size:clamp(44px,6.2vw,92px);line-height:1.02}
#lt-vente .hero h1 em{font-style:italic;font-weight:500;color:#ff8a8e}
#lt-vente .hero .k{color:#ff8a8e}
#lt-vente .hero .lead{color:#cfe2e8}
#lt-vente .hero .btn{background:#f8f9fa;color:var(--ink)}
#lt-vente .hero .btn:hover{background:#fff}
#lt-vente .hero .btn.ghost{background:transparent;color:#f8f9fa;border-color:rgba(255,255,255,.5)}
#lt-vente .hero .btn.ghost:hover{background:rgba(255,255,255,.08)}
#lt-vente .hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
#lt-vente .hero .ticks{color:#cfe2e8}
#lt-vente .stage{position:relative;aspect-ratio:1/0.92;width:100%;max-width:680px;justify-self:center}
#lt-vente .glow{position:absolute;left:50%;top:48%;width:86%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,138,142,.42) 0%,rgba(255,138,142,.12) 38%,transparent 66%);animation:ltGlow 7s ease-in-out infinite alternate}
#lt-vente .ring{position:absolute;left:50%;top:48%;width:74%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(255,138,142,.28);border-radius:50%;animation:ltSpin 40s linear infinite}
#lt-vente .ring:after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:#ff8a8e;box-shadow:0 0 14px #ff8a8e}
#lt-vente .prod{position:absolute;will-change:transform}
#lt-vente .prod .fl{animation:ltFloat 6s ease-in-out infinite alternate}
#lt-vente .prod img{display:block;width:100%;height:auto;filter:drop-shadow(0 34px 34px rgba(0,0,0,.55))}
#lt-vente .prod .sh{position:absolute;left:12%;right:12%;bottom:-6%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);animation:ltShadow 6s ease-in-out infinite alternate}
#lt-vente .p1{left:4%;bottom:20%;width:26%;z-index:1}
#lt-vente .p2{left:31%;bottom:27%;width:24%;z-index:2}
#lt-vente .p3{left:50%;bottom:9%;width:46%;z-index:3}
#lt-vente .p2 .fl,#lt-vente .p2 .sh{animation-delay:-2s}
#lt-vente .p3 .fl,#lt-vente .p3 .sh{animation-delay:-4s}
#lt-vente .in{opacity:0;transform:translateY(26px);animation:ltIn .9s cubic-bezier(.2,.7,.2,1) forwards}
#lt-vente .d1{animation-delay:.1s}#lt-vente .d2{animation-delay:.25s}#lt-vente .d3{animation-delay:.4s}#lt-vente .d4{animation-delay:.55s}#lt-vente .d5{animation-delay:.7s}
#lt-vente .marq{border-top:1px solid rgba(255,255,255,.14);overflow:hidden;white-space:nowrap;padding:16px 0}
#lt-vente .marq div{display:inline-block;animation:ltMarq 32s linear infinite;font-family:Poppins,Arial,sans-serif;font-size:20px;letter-spacing:.06em;color:rgba(255,255,255,.55)}
#lt-vente .marq span{margin:0 26px;color:#ff8a8e}
@keyframes ltFloat{from{transform:translateY(0) rotate(-1.2deg)}to{transform:translateY(-22px) rotate(1.2deg)}}
@keyframes ltShadow{from{transform:scale(1);opacity:.9}to{transform:scale(.82);opacity:.55}}
@keyframes ltGlow{from{opacity:.75;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes ltSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ltIn{to{opacity:1;transform:none}}
@keyframes ltMarq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#lt-vente .fl,#lt-vente .sh,#lt-vente .glow,#lt-vente .ring,#lt-vente .marq div{animation:none}#lt-vente .in{animation:none;opacity:1;transform:none}}
#lt-vente .step .pic{margin:-28px -28px 22px;aspect-ratio:1/1;overflow:hidden;border-radius:18px 18px 0 0}
#lt-vente .step .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
#lt-vente .step:hover .pic img{transform:scale(1.05)}
#lt-vente .step{overflow:hidden}
#lt-vente .final{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0;overflow:hidden;text-align:left}
#lt-vente .final img{width:100%;height:100%;object-fit:cover;display:block;min-height:360px}
#lt-vente .final .ft{padding:56px 48px;align-self:center}
/* bandeau */
#lt-vente .band{background:var(--ink);color:#f8f9fa;padding:54px 0}
#lt-vente .band h2{color:#fff;margin:0 auto 10px;max-width:780px}
#lt-vente .band p{color:#cfe2e8;max-width:640px;margin:0 auto}
#lt-vente .nums{display:flex;justify-content:center;gap:56px;margin-top:30px;flex-wrap:wrap}
#lt-vente .nums div{text-align:center}
#lt-vente .nums b{display:block;font-family:Poppins,Arial,sans-serif;font-size:44px;color:#fff;line-height:1}
#lt-vente .nums span{font-size:13px;color:#cfe2e8;letter-spacing:.06em}
/* étapes */
#lt-vente .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
#lt-vente .step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
#lt-vente .step .num{font-family:Poppins,Arial,sans-serif;font-size:44px;color:var(--bronze);line-height:1;margin-bottom:10px}
#lt-vente .step .fmt{font-size:13px;color:var(--muted);margin-bottom:12px}
#lt-vente .step ul{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--line)}
#lt-vente .step li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
#lt-vente .step li b{color:var(--ink);display:block;font-size:14px}
#lt-vente .step .res{margin-top:14px;font-size:13.5px;color:var(--bronze-t)}
/* carrousel */
#lt-vente .car{position:relative;margin-top:40px}
#lt-vente .track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding-bottom:6px;scrollbar-width:none}
#lt-vente .track::-webkit-scrollbar{display:none}
#lt-vente .slide{flex:0 0 calc((100% - 40px)/3);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#lt-vente .slide .ph{aspect-ratio:4/5;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}
#lt-vente .slide img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#f1f5f6}
#lt-vente .slide .du{display:block;font-size:13px;color:var(--muted);margin-top:2px}
#lt-vente .slide .tx{padding:18px 20px 22px}
#lt-vente .slide .tx p{font-size:15px;color:var(--muted);margin:0 0 8px;font-style:italic}
#lt-vente .slide .tx b{font-size:14px}
#lt-vente .arr{position:absolute;top:38%;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(26,24,22,.08)}
#lt-vente .arr[hidden]{display:none}
#lt-vente .arr.p{left:-18px}#lt-vente .arr.n{right:-18px}
#lt-vente .dots{display:flex;justify-content:center;gap:8px;margin-top:20px}
#lt-vente .dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
#lt-vente .dots button[aria-current="true"]{background:var(--ink)}
/* routine + sans */
#lt-vente .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
#lt-vente .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
#lt-vente .box ol{margin:0;padding-left:20px}#lt-vente .box li{margin-bottom:10px}
#lt-vente .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
#lt-vente .chips span{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;background:var(--bg)}
/* comparatif */
#lt-vente .story{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;margin-top:36px}
#lt-vente .story .q{font-family:Poppins,Arial,sans-serif;font-size:72px;line-height:.8;color:var(--bronze)}
#lt-vente .story p{font-size:17px;margin:0 0 12px}
#lt-vente .story .sig{font-size:14px;color:var(--muted);margin:0}
#lt-vente .cmp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px;align-items:stretch}
#lt-vente .rt{border:1px solid var(--line);border-radius:18px;padding:24px;background:var(--card);display:flex;flex-direction:column}
#lt-vente .rt .who{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze-t);font-weight:600;margin-bottom:4px}
#lt-vente .rt h3{font-size:19px;margin-bottom:12px}
#lt-vente .rt ul{list-style:none;padding:0;margin:0 0 16px;flex:1}
#lt-vente .rt li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
#lt-vente .rt li span{color:var(--muted)}#lt-vente .rt li b{white-space:nowrap;font-weight:600}
#lt-vente .rt .tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#lt-vente .rt .tot b{font-family:Poppins,Arial,sans-serif;font-size:28px;white-space:nowrap}
#lt-vente .rt .tot span{font-size:13px;color:var(--muted)}
#lt-vente .rt.mine{border:2px solid var(--bronze)}
#lt-vente .rt .eco{margin-top:12px;background:var(--soft);color:var(--bronze-t);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;text-align:center}
#lt-vente .rt.me{background:var(--ink);border-color:var(--ink)}
#lt-vente .rt.me *{color:#fff}#lt-vente .rt.me li,#lt-vente .rt.me .tot{border-color:rgba(255,255,255,.14)}#lt-vente .rt.me li span,#lt-vente .rt.me .tot span{color:#cfe2e8}#lt-vente .rt.me .who{color:#ff8a8e}
/* offres */
#lt-vente .offers{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:880px;margin:40px auto 0}
#lt-vente .offer{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;display:flex;flex-direction:column}
#lt-vente .offer.best{border:2px solid var(--bronze);position:relative}
#lt-vente .offer .tag{position:absolute;top:-14px;left:28px;background:var(--bronze);color:#fff;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:5px 14px}
#lt-vente .offer .amt{font-family:Poppins,Arial,sans-serif;font-size:46px;font-weight:600;line-height:1;margin:10px 0 4px}
#lt-vente .offer ul{list-style:none;padding:0;margin:18px 0 26px;flex:1}
#lt-vente .offer li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
#lt-vente .offer .btn{width:100%}
/* faq */
#lt-vente .why2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}
#lt-vente .wc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px}
#lt-vente .wc .wn{font-family:Poppins,Arial,sans-serif;font-size:40px;color:var(--bronze);line-height:1;margin-bottom:10px}
#lt-vente .wc p{color:var(--muted)}
#lt-vente .wc ul{list-style:none;padding:0;margin:16px 0 0}
#lt-vente .wc li{padding:9px 0 9px 22px;border-top:1px solid var(--line);position:relative;font-size:15px}
#lt-vente .wc li:before{content:"";position:absolute;left:2px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--bronze)}
#lt-vente .uniq{margin-top:20px;background:var(--ink);color:#f8f9fa;border-radius:20px;padding:40px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:36px;align-items:center}
#lt-vente .uniq h3{color:#fff;font-size:28px}#lt-vente .uniq p{color:#cfe2e8;margin:0}
#lt-vente .uq-g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#lt-vente .uq-g div{border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px}
#lt-vente .uq-g b{display:block;color:#fff;font-size:15px;margin-bottom:4px}#lt-vente .uq-g span{font-size:13.5px;color:#cfe2e8;line-height:1.45;display:block}
#lt-vente .tl{margin-top:44px}
#lt-vente .tl-g{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
#lt-vente .tl-g:before{content:"";position:absolute;left:12.5%;right:12.5%;top:11px;height:2px;background:linear-gradient(90deg,var(--bronze),var(--line))}
#lt-vente .tl-i{text-align:center;position:relative;padding:0 10px}
#lt-vente .tl-i:before{content:"";display:block;width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--bronze);margin:0 auto 14px;position:relative;box-shadow:inset 0 0 0 5px var(--bg);background-color:var(--bronze)}
#lt-vente .tl-d{font-family:Poppins,Arial,sans-serif;font-size:26px;font-weight:600}
#lt-vente .tl-t{font-size:14px;color:var(--muted);margin-top:4px}
#lt-vente .faq{max-width:820px;margin:36px auto 0}
#lt-vente details{border-bottom:1px solid var(--line);padding:18px 0}
#lt-vente summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
#lt-vente summary::-webkit-details-marker{display:none}
#lt-vente summary:after{content:"+";font-weight:400;font-size:22px;color:var(--bronze);line-height:1}
#lt-vente details[open] summary:after{content:"–"}
#lt-vente details p{margin:12px 0 0;color:var(--muted)}
#lt-vente .final{background:var(--ink);color:#fff;border-radius:24px}
#lt-vente .final h2{color:#fff}#lt-vente .final p{color:#cfe2e8}
#lt-vente .final .btn{background:#f8f9fa;color:var(--ink)}
#lt-vente .final .btn:hover{background:#fff}
#lt-vente .legal{font-size:12px;color:var(--muted);text-align:center;max-width:760px;margin:28px auto 0}
@media(max-width:900px){
  #lt-vente section{padding:52px 0}
  #lt-vente .two,#lt-vente .offers,#lt-vente .final{grid-template-columns:1fr;gap:28px}
  #lt-vente .hero .w{grid-template-columns:1fr;gap:8px;padding-top:40px}
  #lt-vente .hero{min-height:0}
  #lt-vente .stage{max-width:440px}
  #lt-vente .final{gap:0}#lt-vente .final .ft{padding:40px 28px}
  #lt-vente .steps{grid-template-columns:1fr}
  #lt-vente .cmp{grid-template-columns:1fr}
  #lt-vente .why2,#lt-vente .uniq{grid-template-columns:1fr}
  #lt-vente .uniq{padding:28px;gap:20px}
  #lt-vente .uq-g{grid-template-columns:1fr 1fr}
  #lt-vente .tl-g{grid-template-columns:1fr 1fr;row-gap:26px}
  #lt-vente .tl-g:before{display:none}
  #lt-vente .story{grid-template-columns:1fr;gap:6px;padding:26px}
  #lt-vente .slide{flex-basis:82%}
  #lt-vente .arr{display:none}
  #lt-vente .w{padding:0 18px}
}
/* Marque Mireille Chevalier */
#lt-vente{--deep:#0a4f63;--coral:#ff585d;--coral-h:#e5484d}
#lt-vente h1,#lt-vente h2{letter-spacing:-.015em}
#lt-vente .btn,#lt-vente .hero .btn,#lt-vente .final .btn{background:var(--coral);color:#fff}
#lt-vente .btn:hover,#lt-vente .hero .btn:hover,#lt-vente .final .btn:hover{background:var(--coral-h)}
#lt-vente .btn.ghost{background:transparent;color:#007396;border-color:#007396}
#lt-vente .btn.ghost:hover{background:var(--soft)}
#lt-vente .hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
#lt-vente .hero .btn.ghost:hover{background:rgba(255,255,255,.1)}
#lt-vente .hero h1{font-size:clamp(40px,5.2vw,78px);line-height:1.05}
#lt-vente .hero h1 em{font-weight:500}
#lt-vente .band,#lt-vente .uniq,#lt-vente .final,#lt-vente .rt.me{background:var(--deep);border-color:var(--deep)}
#lt-vente h2,#lt-vente .step h3,#lt-vente .wc h3,#lt-vente .rt h3{color:#007396}
#lt-vente .band h2,#lt-vente .final h2,#lt-vente .hero h1,#lt-vente .rt.me h3{color:#fff}
#lt-vente .dots button[aria-current="true"]{background:#007396}
/* Mode lancement */
#lt-vente .lt-cd,#lt-vente .lt-cd-g,#lt-vente .lt-cd-g div,#lt-vente .lt-cd-t{background:transparent!important;box-shadow:none!important}
#lt-vente .lt-cd{margin-top:26px}
#lt-vente .lt-cd-t{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--bronze-t);margin-bottom:10px}
#lt-vente .lt-cd-g{display:flex;align-items:flex-start}
#lt-vente .c .lt-cd-g,#lt-vente .lt-cd.c .lt-cd-g{justify-content:center}
#lt-vente .lt-cd-g div{text-align:center;padding:0 22px;min-width:92px}#lt-vente .lt-cd-g div:first-child{padding-left:0;min-width:70px}#lt-vente .lt-cd.c .lt-cd-g div:first-child{padding-left:22px}#lt-vente .lt-cd-g div+div{border-left:1px solid var(--line)}
#lt-vente .lt-cd-g b{display:block;font-family:Poppins,Arial,sans-serif;font-weight:600;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:6px}
#lt-vente .lt-cd-g span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#lt-vente .lt-cd.dark .lt-cd-t{color:#ff8a8e}
#lt-vente .lt-cd.dark .lt-cd-g div+div{border-color:rgba(255,255,255,.22)}

/* ----- Mode lancement ----- */
function lancement(){const f=ferme();
  root.querySelectorAll("[data-cta]").forEach(a=>{if(f){a.removeAttribute("href");a.removeAttribute("target");a.classList.add("lock");a.setAttribute("aria-disabled","true");a.textContent="Disponible le "+jourOuv;}

  if(!f)root.querySelectorAll("[data-cd]").forEach(x=>x.remove());return f;}
if(lancement()){const p2=n=>String(n).padStart(2,"0");
  (function tic(){const r=Math.max(0,OUV-Date.now()),v={j:Math.floor(r/864e5),h:Math.floor(r/36e5)%24,m:Math.floor(r/6e4)%60,s:Math.floor(r/1e3)%60};
    root.querySelectorAll("[data-u]").forEach(b=>b.textContent=p2(v[b.dataset.u]));
    if(r>0)setTimeout(tic,1000-Date.now()%1000);else lancement();})();}

/* ----- Carrousel ----- */
const tr=root.querySelector(".track"),sl=[...tr.children],dots=root.querySelector(".dots");
const per=()=>Math.max(1,Math.round(tr.clientWidth/sl[0].getBoundingClientRect().width));
let pages=1;
function build(){pages=Math.max(1,Math.ceil(sl.length-per()+1));dots.innerHTML=pages>1?Array.from({length:pages},(_,k)=>`<button type="button" aria-label="Aller à la transformation ${k+1}"></button>`).join(""):"";
  dots.querySelectorAll("button").forEach((b,k)=>b.onclick=()=>go(k));
  root.querySelectorAll(".arr").forEach(x=>x.hidden=pages<2);upd();}
function go(k){k=Math.max(0,Math.min(pages-1,k));tr.scrollTo({left:sl[k].offsetLeft-sl[0].offsetLeft,behavior:"smooth"});}
function cur(){const x=tr.scrollLeft;let best=0,d=1e9;sl.forEach((s,k)=>{const dd=Math.abs(s.offsetLeft-sl[0].offsetLeft-x);if(dd<d){d=dd;best=k;}});return Math.min(best,pages-1);}
function upd(){const c=cur();dots.querySelectorAll("button").forEach((b,k)=>b.setAttribute("aria-current",k===c));}
root.querySelector(".arr.p").onclick=()=>go(cur()-1);root.querySelector(".arr.n").onclick=()=>go(cur()+1);
tr.addEventListener("scroll",()=>{clearTimeout(tr._t);tr._t=setTimeout(upd,80);});
window.addEventListener("resize",build);build();

/* ----- Pleine largeur, même dans une section GHL à largeur limitée ----- */
function full(){root.style.width="";root.style.marginLeft="";const vw=document.documentElement.clientWidth,r=root.getBoundingClientRect();
  if(r.width<vw-1){root.style.width=vw+"px";root.style.marginLeft=(-r.left)+"px";}}
full();window.addEventListener("resize",full);

/* ----- En-tête : parallaxe à la souris et au défilement ----- */
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!reduce){const prods=[...root.querySelectorAll(".prod")],hero=root.querySelector(".hero");let mx=0,my=0,tx=0,ty=0,sy=0;
  hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect();mx=(e.clientX-r.left)/r.width-.5;my=(e.clientY-r.top)/r.height-.5;});
  hero.addEventListener("pointerleave",()=>{mx=0;my=0;});
  window.addEventListener("scroll",()=>{sy=Math.max(0,-hero.getBoundingClientRect().top);},{passive:true});
  (function loop(){tx+=(mx-tx)*.06;ty+=(my-ty)*.06;
    prods.forEach(p=>{const d=+p.dataset.d;p.style.transform=`translate3d(${(-tx*d).toFixed(2)}px,${(-ty*d-sy*d/120).toFixed(2)}px,0)`;});
    requestAnimationFrame(loop);})();}
})();
